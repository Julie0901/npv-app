  '<b>Payback</b>: 원금 회수 기간. 시간가치와 회수 이후 현금흐름을 무시 → 최악은 회수 시점에 딱 한 번 들어오는 경우, 최선은 무한대(5-23).',
  '<b>IRR</b>: NPV = 0이 되는 할인율. 투자형(–, +, +…)이면 IRR > r일 때 채택.',
  '<b>규모 문제(scale problem)</b>: 작은 프로젝트가 IRR은 높아도 NPV는 작을 수 있음 → <b>incremental IRR</b>(큰 것 – 작은 것)이 r보다 크면 큰 프로젝트 선택(5-18).',
  '<b>Multiple IRRs</b>: 현금흐름 부호가 여러 번 바뀌면 IRR이 여러 개(Descartes’ rule of signs). 이때는 IRR 규칙 대신 NPV > 0 구간을 봅니다(5-22, 5-24).',
  '<b>PI</b> = PV of future CFs / initial investment. 자본 제약(capital rationing)에서 유용.'],
 analogy:'검사 비유: NPV는 “확진 검사”, Payback·IRR은 “선별 검사”. 선별 검사는 빠르지만 위양성/위음성이 있어 결과가 엇갈리면 NPV로 확인합니다.',
 fx:[['NPV','NPV = –C₀ + Σ CFₜ/(1 + r)ᵗ'],['IRR','0 = –C₀ + Σ CFₜ/(1 + IRR)ᵗ'],['Payback','Years before recovery + (Unrecovered cost / CF in next year)'],['Profitability index','PI = PV of future CFs / Initial investment'],['Incremental IRR','IRR of (CF_large – CF_small)'],['Descartes’ rule','# of IRRs ≤ # of sign changes']],
 ph:[['Since the NPV is positive, the project should be accepted.','NPV가 양수이므로 채택'],['The IRR criterion can rank mutually exclusive projects incorrectly because of the scale problem.','IRR은 규모 문제로 순위를 잘못 매길 수 있음'],['Because the incremental IRR (12.68%) exceeds the required return (8%), we choose the larger project.','증분 IRR이 요구수익률보다 크므로 큰 프로젝트 선택'],['Because the cash flows change sign twice, there are either zero or two IRRs.','부호가 두 번 바뀌므로 IRR은 0개 또는 2개']]},
{id:'ch6',tab:'Ch 6',num:'CHAPTER 6',title:'Making Capital Investment Decisions',
 lead:'프로젝트 때문에 “추가로” 생기는 현금흐름(incremental cash flow)만 셉니다.',
 pts:['<b>포함</b>: 기회비용(opportunity cost, 예: 기존 기계를 팔 수 있었던 돈), 부수효과(side effects), 순운전자본(NWC) 투자와 회수.',
  '<b>제외</b>: 매몰비용(sunk cost), 이자비용(할인율에 이미 반영).',
  '<b>OCF (tax shield approach)</b>: 비용 절감액 × (1 – T) + 감가상각 × T. 감가상각의 절세효과(D × T)를 따로 더하는 방식.',
  '<b>MACRS</b>: 표의 비율 × 취득원가. 프로젝트 종료 시점 장부가 = 원가 – 누적 감가상각.',
  '<b>After-tax salvage</b>: 장부가보다 싸게 팔면 손실 → 세금 환급(+), 비싸게 팔면 이익 → 세금(–).',
  '<b>NWC</b>: 초기에 투자(–), 매년 추가분(–), 마지막 해에 전액 회수(+). 6-13에서 마지막 해 추가분은 바로 회수되므로 0.',
  '<b>EAC</b>: 수명이 다른 기계를 영구 교체할 때 비교 → 비용의 PV를 연금으로 환산. 덜 음수인 쪽 선택(6-18).',
  '<b>교체 결정</b>: “새 기계 구입” vs “기존 기계 유지”를 두 프로젝트처럼 비교하거나, 차이(증분) 현금흐름으로 계산 → 같은 답(6-30).'],
 analogy:'수술 결정 비유: 이미 쓴 검사비(매몰비용)는 수술할지 말지에 영향을 주면 안 됩니다. 수술해서 “앞으로 달라지는” 비용·효과만 봅니다.',
 fx:[['OCF (tax shield)','OCF = (Sales – Costs)(1 – T) + T × D'],['OCF (bottom-up)','OCF = Net income + Depreciation'],['After-tax salvage','ATSV = S – T × (S – BV)'],['Book value','BV = Cost – Accumulated depreciation'],['EAC','EAC = PV of costs / PVIFA(r, life)'],['Project NPV','NPV = –Capex – NWC₀ + Σ (OCF – ΔNWC)ₜ/(1 + r)ᵗ + (ATSV + NWC recovery)/(1 + r)ᵀ']],
 ph:[['Sunk costs are irrelevant to the decision.','매몰비용은 의사결정과 무관'],['The asset is sold at a loss to book value, which creates a tax refund.','장부가 이하로 매각 → 세금 환급'],['Since we are only dealing with costs, a negative NPV is expected; choose the less negative one.','비용만 비교하므로 덜 음수인 쪽 선택'],['Machine B should be chosen because it has the less negative EAC.','EAC가 덜 음수인 B 선택']]},
{id:'ch7',tab:'Ch 7',num:'CHAPTER 7',title:'Risk Analysis, Real Options, and Capital Budgeting',
 lead:'NPV 추정에는 불확실성이 있으니, 손익분기점과 “나중에 바꿀 수 있는 선택권(real options)”을 함께 봅니다.',
 pts:['<b>Accounting break-even</b>: 순이익 = 0이 되는 판매량. (FC + D)/(P – v).',
  '<b>Cash break-even</b>: OCF = 0. FC/(P – v).',
  '<b>Financial break-even</b>: NPV = 0. 초기투자를 EAC로 바꿔 매년 회수해야 할 금액으로 봅니다(7-10).',
  '<b>Option to wait</b>: 오늘 NPV가 음수여도 기다리면 양수가 될 수 있음. 각 연도 NPV를 “모두 오늘 가치로” 할인해서 최대인 해를 고릅니다(7-5).',
  '<b>Option to abandon</b>: 첫해 이후 남은 현금흐름의 PV가 매각가치보다 작으면 포기. 기준 현금흐름 = 매각가치 / PVIFA(r, 남은 기간)(7-23).',
  '<b>Sensitivity / scenario analysis</b>: 변수 하나씩 바꾸기 vs. 여러 변수를 동시에 바꾼 시나리오.'],
 analogy:'치료 계획 비유: 지금 수술할 수도, 경과 관찰 후 결정할 수도 있습니다(wait). 반응이 나쁘면 중단할 수 있는 선택권(abandon)은 그 자체로 가치가 있습니다.',
 fx:[['Accounting BE','Q = (FC + D)/(P – v)'],['Cash BE','Q = FC/(P – v)'],['Financial BE','Q = [EAC + FC(1 – T) – D × T]/[(P – v)(1 – T)]'],['EAC of investment','EAC = Initial investment / PVIFA(r, n)'],['Wait (value today)','NPV_k = [–Cost_k + CF × PVIFA(r, n – k)]/(1 + r)ᵏ'],['Abandon threshold','C = Salvage / PVIFA(r, remaining years)']],
 ph:[['To compare, all NPVs must be discounted to a common date (today).','비교하려면 모든 NPV를 같은 시점으로'],['The firm should abandon the project if the PV of the revised cash flows is less than the salvage value.','수정 현금흐름의 PV < 매각가치이면 포기'],['At the financial break-even point, the project’s NPV is zero.','재무적 손익분기점에서 NPV = 0']]},
{id:'ch8',tab:'Ch 8',num:'CHAPTER 8',title:'Interest Rates and Bond Valuation',
 lead:'채권 가격 = 이표(연금)의 PV + 액면가(일시금)의 PV. 금리가 오르면 가격은 내립니다.',
 pts:['<b>반기 지급(semiannual)</b>: 쿠폰 ÷ 2, 이자율 ÷ 2, 기간 × 2. 가장 흔한 실수 포인트.',
  '<b>Par / Premium / Discount</b>: 쿠폰율 = YTM이면 액면가, 쿠폰율 > YTM이면 할증, < 이면 할인. 그래서 새 채권을 액면가에 팔려면 쿠폰율 = 현재 YTM(8-21).',
  '<b>Interest rate risk</b>: 만기가 길수록, 쿠폰이 낮을수록 가격 변동이 큽니다(8-19).',
  '<b>YTM = Current yield + Capital gains yield</b>: 할증채는 현재수익률이 높고 가격이 하락, 할인채는 반대(8-29).',
  '<b>HPY</b>: 만기 전에 팔 때 실제 실현 수익률. 금리가 떨어지면 매도가가 올라 HPY > YTM(8-30).',
  '<b>Zero coupon</b>: 액면가의 PV만 남습니다. 불규칙 쿠폰은 구간별 연금 PV를 구해 다시 할인(8-31).'],
 analogy:'시소 비유: 한쪽이 금리, 다른 쪽이 채권가격. 저쿠폰·장기채는 시소 판이 길어서 같은 금리 변화에도 더 크게 움직입니다.',
 fx:[['Bond price','P = C × PVIFA(r, n) + F × PVIF(r, n)'],['Semiannual','C/2, r/2, 2n'],['Current yield','Annual coupon / Price'],['Capital gains yield','(P₁ – P₀)/P₀'],['Relationship','YTM = Current yield + Capital gains yield'],['% price change','(P_new – P_old)/P_old']],
 ph:[['All else the same, the lower the coupon rate, the greater the price sensitivity to interest rates.','다른 조건이 같으면 쿠폰이 낮을수록 가격 민감도가 큼'],['A bond sells at par when its coupon rate equals the YTM.','쿠폰율 = YTM이면 액면가 거래'],['The HPY exceeds the YTM because interest rates fell, and bond prices rise when yields fall.','금리 하락 → 가격 상승 → HPY > YTM']]},
{id:'ch9',tab:'Ch 9',num:'CHAPTER 9',title:'Stock Valuation',
 lead:'주가 = 미래 배당의 현재가치. 성장 패턴에 맞는 공식을 고르는 게 핵심입니다.',
 pts:['<b>Zero growth</b>: 영구연금 P = D/R. 우선주가 대표적(9-19).',
  '<b>Constant growth (Gordon)</b>: P₀ = D₁/(R – g) = D₀(1 + g)/(R – g). D₀(방금 지급)와 D₁(다음 해) 구분이 함정.',
  '<b>Differential growth</b>: 고성장 기간 배당을 하나씩 구하고, 일정 성장이 시작되기 “한 해 전” 주가 Pₙ = Dₙ₊₁/(R – g)를 구해 함께 할인(9-15, 9-31).',
  '<b>요구수익률 분해</b>: R = D₁/P₀ + g = 배당수익률 + 자본이득률.',
  '<b>지연 시작 영구연금</b>: 첫 배당이 5년 후면 영구연금 공식은 4년 시점 가치 → 4년 할인(9-19).',
  '<b>PE ratio</b>: 성장기회(NPVGO)가 클수록 PE가 높습니다(9-25).'],
 analogy:'성장곡선 비유: 소아 성장기(고성장)를 지나 성인이 되면 일정한 속도로 자랍니다. 성인이 되는 시점의 “몸값”(Pₙ)을 한 번에 계산하고 앞의 성장기 배당을 더합니다.',
 fx:[['Zero growth','P₀ = D/R'],['Constant growth','P₀ = D₁/(R – g),  D₁ = D₀(1 + g)'],['Differential growth','P₀ = Σ Dₜ/(1 + R)ᵗ + Pₙ/(1 + R)ⁿ,  Pₙ = Dₙ₊₁/(R – g)'],['Required return','R = D₁/P₀ + g'],['PE with growth','P = EPS/R + NPVGO']],
 ph:[['We find the price of the stock when the dividends level off at a constant growth rate.','배당이 일정 성장으로 안정되는 시점의 주가를 구함'],['The price today is the PV of the dividends during the high-growth period plus the PV of P₃.','현재 주가 = 고성장기 배당 PV + P₃의 PV'],['The PE ratio reflects the value of growth opportunities.','PE는 성장기회의 가치를 반영']]},
{id:'ch11',tab:'Ch 11',num:'CHAPTER 11',title:'Return, Risk, and the CAPM',
 lead:'분산투자로 없앨 수 있는 위험(unsystematic)은 보상받지 못하고, 베타로 측정하는 체계적 위험만 보상받습니다.',
 pts:['<b>기대수익률·분산·표준편차</b>: 상황별 확률 × 수익률로 계산. 표준편차는 총위험.',
  '<b>공분산·상관계수</b>: 두 자산이 같이 움직이는 정도. ρ가 낮을수록 분산효과가 큽니다(11-25).',
  '<b>Beta</b>: 시장 대비 민감도 = 체계적 위험. β = ρ × σᵢ/σ_M(11-31).',
  '<b>CAPM / SML</b>: E(R) = R_f + β[E(R_M) – R_f]. 기대수익률이 SML 위에 있으면 저평가(undervalued), 아래면 고평가(11-18).',
  '<b>Reward-to-risk (Treynor) ratio</b>: (E(R) – R_f)/β. 균형에서는 모든 자산이 같음 → 두 자산으로 R_f, R_M 역산 가능(11-34).',
  '<b>CML</b>: 잘 분산된 포트폴리오만 해당, x축은 σ. SML은 모든 자산, x축은 β(11-30).',
  '<b>음(–)의 비중</b>: 공매도(short sale). 목표 수익률이 두 자산보다 높으면 낮은 쪽을 공매도(11-24).',
  '<b>11-33의 함정</b>: σ가 큰 주식(II)보다 β가 큰 주식(I)이 “더 위험한” 주식입니다.'],
 analogy:'유전 vs 생활습관 비유: 생활습관 위험(개별 기업 위험)은 관리(분산)로 줄일 수 있지만, 모두에게 공통인 환경 위험(시장 위험)은 피할 수 없어 그 대가로 보상(위험프리미엄)을 받습니다.',
 fx:[['Expected return','E(R) = Σ pₛ Rₛ'],['Variance','σ² = Σ pₛ (Rₛ – E[R])²'],['Covariance','Cov = Σ pₛ (R_A – E[R_A])(R_B – E[R_B])'],['Correlation','ρ = Cov/(σ_A σ_B)'],['Portfolio return / beta','E(R_p) = Σ wᵢE(Rᵢ);  β_p = Σ wᵢβᵢ'],['CAPM (SML)','E(Rᵢ) = R_f + βᵢ[E(R_M) – R_f]'],['CML','E(R_p) = R_f + {[E(R_M) – R_f]/σ_M} × σ_p'],['Beta','βᵢ = ρᵢ,M × σᵢ/σ_M'],['Reward-to-risk','[E(Rᵢ) – R_f]/βᵢ']],
 ph:[['Stock Y plots below the SML and is overvalued; its price must fall.','SML 아래 → 고평가 → 가격 하락해야'],['A negative portfolio weight means short selling the stock.','음의 비중은 공매도'],['Unsystematic risk can be diversified away, so only systematic risk is rewarded.','비체계적 위험은 분산으로 제거 → 체계적 위험만 보상'],['A well-diversified portfolio has no unsystematic risk and lies on the CML.','잘 분산된 포트폴리오는 CML 위에 있음']]},
{id:'sheet',tab:'공식집'}
];

const CH1QA=[
['1-3','Goal of the firm','“Managers should not focus on the current stock value because it leads to short-termism.” Evaluate.','The statement is false, provided markets are efficient. The current stock value reflects the risk, timing, and magnitude of all future cash flows, both short-term and long-term. Maximizing the current stock price therefore already accounts for long-term profits.','현재 주가는 단기·장기 모든 현금흐름의 위험·시점·크기를 반영 → 진술은 틀림.'],
['1-4','Ethics and firm goals','Can maximizing stock value conflict with ethical behavior, safety, the environment, or society?','An argument can be made either way. One view: in a market economy these things are priced (lawsuits, fines, reputation), so stock-value maximization already includes them. The other view: they are non-economic issues best handled through regulation and the political process. Example: a safety fix costs $30 million but saves only $20 million in liability claims. Should the firm do it?','양쪽 다 논증 가능: 시장이 가격에 반영한다 vs. 규제·정치의 영역. 안전 개선 비용 > 소송 절감액 사례를 들 것.'],
['1-5','International firm goal','Would the goal of maximizing stock value differ in a foreign country?','The goal is the same, but the best course of action toward that goal may differ because of different social, political, and economic institutions.','목표는 같고, 제도 차이로 실행 방법만 다를 수 있음.'],
['1-7','Agency problems and ownership','Are agency problems more or less severe in Germany and Japan, where banks and institutions own most stock?','Less severe. Ownership is concentrated in institutions rather than many individuals, so there are fewer diverse opinions on corporate goals. Institutions have the resources and experience to monitor managers more effectively, which aligns owner and manager decisions on risky projects.','덜 심각: 소유 집중 + 기관의 감시 능력.'],
['1-8','Institutional activism','Large institutions now dominate U.S. ownership and are more active. Implications?','Growing institutional ownership and activism may reduce agency problems and create a more efficient market for corporate control. However, if fund managers do not act in their own investors’ interests, a new agency problem arises between the fund and its investors, so the overall problem may not shrink.','대리인 문제 완화 + 지배권 시장 효율화, 단 펀드–투자자 간 2차 대리인 문제 가능.'],
['1-9','Executive compensation','Is very high CEO pay (e.g., ~$95 million) excessive, compared with top athletes and entertainers?','There is a market for executive talent, just as for athletes and performers, and compensation is the price that clears that market. Much of the growth comes from stock-based pay, which aligns managers with stockholders. Critics argue that part of this reward reflects market-wide price gains rather than managerial skill, so pay could be tied to performance relative to the market.','경영자 노동시장 가격 + 주식보상으로 이해일치. 비판: 시장 전체 상승분까지 보상 → 상대성과 연동 제안.']
];

/* --- chart: NPV profile --- */
function npvChart(series,lo,hi){const W=620,H=230,L=66,Rr=14,T=14,B=34;const xs=[],K=160;for(let i=0;i<=K;i++)xs.push(lo+(hi-lo)*i/K);
 let ys=series.map(s=>xs.map(r=>npv(r,s.cf)));let mn=Math.min(0,...ys.flat()),mx=Math.max(0,...ys.flat());if(mx-mn<1){mx+=1}const pad=(mx-mn)*.08;mn-=pad;mx+=pad;
 const X=r=>L+(r-lo)/(hi-lo)*(W-L-Rr),Y=v=>T+(mx-v)/(mx-mn)*(H-T-B);
 const cm=v=>{const a=Math.abs(v);const s=v<0?'–':'';return a>=1e6?s+'$'+(a/1e6).toFixed(1)+'M':a>=1e3?s+'$'+(a/1e3).toFixed(0)+'K':s+'$'+a.toFixed(0)};
 let g='';for(let i=0;i<=5;i++){const r=lo+(hi-lo)*i/5;g+=`<line class="axis" x1="${X(r)}" y1="${T}" x2="${X(r)}" y2="${H-B}"/><text x="${X(r)}" y="${H-B+16}" text-anchor="middle">${(r*100).toFixed(0)}%</text>`}
 for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4;g+=`<text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${cm(v)}</text>`}
 g+=`<line class="zero" x1="${L}" y1="${Y(0)}" x2="${W-Rr}" y2="${Y(0)}"/>`;
 series.forEach((s,k)=>{g+=`<polyline class="s${k%2}" points="${xs.map((r,i)=>X(r).toFixed(1)+','+Y(ys[k][i]).toFixed(1)).join(' ')}"/>`;roots(r=>npv(r,s.cf),lo,hi,(hi-lo)/2000).forEach(r=>{g+=`<circle class="dot" cx="${X(r)}" cy="${Y(0)}" r="4.5"/>`})});
 g+=`<text class="cap" x="${L}" y="${H-4}">Discount rate →  (red dots = IRR, where NPV crosses zero)</text>`;
 const leg=series.length>1?`<div class="legend">${series.map((s,k)=>`<span>${k?'- - -':'——'} Project ${esc(s.name)}</span>`).join('')}</div>`:'';
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="NPV profile">${g}</svg>${leg}`}

 const ins=c.inputs.map(i=>{const id=`${c.id}-${i.k}`;const unit=i.t==='%'?'%':i.t==='$'?'$':i.t==='int'?'#':'';

function readVals(c){const v=vals[c.id];c.inputs.forEach(i=>{const el=document.getElementById(`${c.id}-${i.k}`);if(!el)return;if(i.t==='list'||i.t==='sel')v[i.k]=el.value;else{const x=parseNum(el.value);if(isFinite(x))v[i.k]=(i.t==='int')?Math.max(1,Math.round(x)):x}})}
function update(c){const el=document.getElementById('card-'+c.id),v=vals[c.id];let r;try{r=c.compute(v)}catch(e){r=null}
 $('.ptxt',el).textContent=c.prompt(v);
 if(!r){$('.lcd',el).innerHTML='<div class="row"><span>입력값을 확인하세요</span><span>Error</span></div>';return}
 c._r=r;
 $('.lcd',el).innerHTML=r.out.map(x=>`<div class="row${x.key?' key':''}"><span>${esc(x.l)}</span><span>${esc(fmtOut(x))}</span></div>`).join('');
 $('.steps',el).innerHTML=r.steps.map(s=>s.startsWith('## ')?`<div class="h">${esc(s.slice(3))}</div>`:`<div>${esc(s)}</div>`).join('');
 $('.ans',el).innerHTML=`<b>ANSWER</b>${esc(r.answer)}`;
 renderKeys(c,el);
 const ch=$('.chart',el);if(r.chart){ch.hidden=false;ch.innerHTML=npvChart(r.chart.series,r.chart.lo,r.chart.hi)}else ch.hidden=true;
 if(el.classList.contains('practice'))buildPractice(c)}
function buildPractice(c){const el=document.getElementById('card-'+c.id),pr=$('.pr',el);el.classList.remove('revealed');const keys=c._r.out.filter(x=>x.key);
 pr.innerHTML=`<div class="hint">답을 입력하세요 (% 문제는 8.07처럼 숫자만, 음수는 –/-)</div>`+keys.map((x,i)=>`<div class="q"><label for="${c.id}-ans${i}">${esc(x.l)}${x.f==='%'?' (%)':''}</label><input id="${c.id}-ans${i}" inputmode="decimal" autocomplete="off"><span class="mk" id="${c.id}-mk${i}"></span></div>`).join('')+`<div class="btns"><button class="btn gold" data-a="check">채점</button><button class="btn" data-a="reveal">풀이 보기</button></div>`}
function check(c){const el=document.getElementById('card-'+c.id),keys=c._r.out.filter(x=>x.key);let all=true;
 keys.forEach((x,i)=>{const u=parseNum(document.getElementById(`${c.id}-ans${i}`).value),mk=document.getElementById(`${c.id}-mk${i}`);const tgt=x.f==='%'?x.v*100:x.v;const tol=Math.max(Math.abs(tgt)*0.005,x.f==='%'?0.02:0.01);const ok=isFinite(u)&&isFinite(tgt)&&Math.abs(u-tgt)<=tol||(!isFinite(tgt)&&!isFinite(u));
  mk.textContent=ok?'✓':'✗';mk.className='mk '+(ok?'ok':'no');if(!ok)all=false});
 el.classList.add('revealed');
 if(all){solved.add(c.id);store.set('cf-solved',[...solved]);$('.solved',el).hidden=false;refreshCounts()}}
function randomize(c){const v=vals[c.id];const U=()=>0.8+Math.random()*0.4;
 c.inputs.forEach(i=>{if(i.fixed)return;const x=v[i.k];
  if(i.t==='$'&&x)v[i.k]=clean(sig3(x*U()));
  else if(i.t==='%'&&x)v[i.k]=clean(Math.round(x*U()*(Math.abs(x)<2?100:10))/(Math.abs(x)<2?100:10));
  else if(i.t==='n'&&x)v[i.k]=clean(Math.round(x*U()*100)/100);
  else if(i.t==='list')v[i.k]=parseList(x).map(z=>{if(!z)return 0;const y=sig3(z*U());return Math.abs(y)<1?String(clean(y)).replace(/^(-?)0\./,'$1.'):clean(y)}).join(', ')});
 setInputs(c)}
function setInputs(c){const v=vals[c.id];c.inputs.forEach(i=>{const el=document.getElementById(`${c.id}-${i.k}`);if(el)el.value=i.t==='list'||i.t==='sel'?v[i.k]:fmtIn(i.t,v[i.k])});update(c)}
function wireCard(c){const el=document.getElementById('card-'+c.id);
 el.addEventListener('input',e=>{if(e.target.closest('.ins')){readVals(c);update(c)}});
 el.addEventListener('change',e=>{if(e.target.closest('.ins')){readVals(c);update(c);const i=c.inputs.find(z=>`${c.id}-${z.k}`===e.target.id);if(i&&i.t==='$')e.target.value=fmtIn('$',vals[c.id][i.k])}});
 el.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='rand')randomize(c);
  if(a==='reset'){c.inputs.forEach(i=>vals[c.id][i.k]=i.v);setInputs(c)}
  if(a==='prac'){const on=!el.classList.contains('practice');el.classList.toggle('practice',on);b.setAttribute('aria-pressed',on);$('.pr',el).hidden=!on;if(on)buildPractice(c);else el.classList.remove('revealed')}
  if(a==='check')check(c);
  if(a==='reveal')el.classList.add('revealed');
  if(a==='copy'){const txt=`Problem ${c.ref}\n`+c._r.steps.map(s=>s.replace(/^## /,'\n')).join('\n')+'\n\nAnswer: '+c._r.answer;const done=()=>{const s=$('.copied',el);s.hidden=false;setTimeout(()=>s.hidden=true,1500)};
   if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done).catch(()=>{const r=document.createRange();r.selectNodeContents($('.steps',el));const sl=getSelection();sl.removeAllRanges();sl.addRange(r)});}
 })}

/* --- TVM calculator --- */
function tvmHTML(){return `<div class="pane" style="padding:0;overflow:hidden;border:0"><div class="calc" style="grid-template-columns:minmax(0,1fr)"><div class="keys tvm">
 <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><b style="font-family:var(--f-display);font-stretch:80%;font-size:18px">TVM 계산기</b><span class="unit" style="font:11px var(--f-mono);color:var(--keylab)">N · I/Y · PV · PMT · FV</span></div>
 <div class="regs">${[['N','기간 수','15'],['IY','기간 이자율 %','7.9'],['PV','현재가치','-153239.01'],['PMT','매기 지급액',''],['FV','미래가치','0']].map(([k,l,v])=>`<div class="reg"><b>${k==='IY'?'I/Y':k}</b><input id="tvm-${k}" aria-label="${l}" value="${v}" inputmode="decimal" placeholder="${l}"><button class="btn gold" data-cpt="${k}">CPT</button></div>`).join('')}</div>
 <div class="btns"><button class="btn" id="tvm-bgn" aria-pressed="false">BGN (기초 지급)</button><button class="btn" id="tvm-clr">CLR</button></div>
 <div class="lcd"><div class="row key"><span id="tvm-lab">PMT 계산 결과</span><span id="tvm-out">—</span></div></div>
 <div class="steps" id="tvm-steps" style="color:var(--keyink)"></div>
 <div style="font-size:12px;color:var(--keylab)">부호 규칙: 내가 내는 돈은 –, 받는 돈은 + (BA II Plus와 동일). 월복리면 I/Y = 연이율/12, N = 개월 수. 채권은 PMT = 쿠폰, FV = 액면가.</div>
 </div></div></div>`}
function tvmWire(){let bgn=false;const g=k=>parseNum($('#tvm-'+k).value)||0;const b=$('#tvm-bgn');b.onclick=()=>{bgn=!bgn;b.setAttribute('aria-pressed',bgn)};
 $('#tvm-clr').onclick=()=>{['N','IY','PV','PMT','FV'].forEach(k=>$('#tvm-'+k).value='');$('#tvm-out').textContent='—';$('#tvm-steps').innerHTML=''};
 document.querySelectorAll('[data-cpt]').forEach(btn=>btn.onclick=()=>{const k=btn.dataset.cpt;let n=g('N'),r=g('IY')/100,pv=g('PV'),pmt=g('PMT'),fv=g('FV');const a=1+r*(bgn?1:0);
  const f=(n,r,pv,pmt,fv)=>pv*Math.pow(1+r,n)+pmt*(1+r*(bgn?1:0))*fvifa(r,n)+fv;let res,txt=[];
  const eq=`0 = PV(1 + r)^N + PMT${bgn?'(1 + r)':''} × [(1 + r)^N – 1]/r + FV`;
  if(k==='FV'){res=-(pv*Math.pow(1+r,n)+pmt*a*fvifa(r,n));txt=[eq,`FV = –[${N(pv,2)}(${D(1+r)})^${n} + ${N(pmt,2)} × ${N(a*fvifa(r,n),4)}] = ${N(res,2)}`]}
  if(k==='PV'){res=-(fv+pmt*a*fvifa(r,n))*pvif(r,n);txt=[`PV = –[FV/(1 + r)^N + PMT${bgn?'(1 + r)':''} × {1 – [1/(1 + r)]^N}/r]`,`PV = –[${N(fv,2)}/${D(1+r)}^${n} + ${N(pmt,2)} × ${N(a*pvifa(r,n),4)}] = ${N(res,2)}`]}
  if(k==='PMT'){res=-(pv*Math.pow(1+r,n)+fv)/(a*fvifa(r,n));txt=[eq,`PMT = –[${N(pv,2)}(${D(1+r)})^${n} + ${N(fv,2)}]/${N(a*fvifa(r,n),4)} = ${N(res,2)}`,`Equivalently, PV = PMT × {1 – [1/(1 + r)]^N}/r${bgn?' × (1 + r)':''} solved for PMT.`]}
  if(k==='N'){if(Math.abs(r)<1e-12)res=-(pv+fv)/pmt;else{const A=pmt*a/r;res=Math.log((A-fv)/(pv+A))/Math.log(1+r)}txt=[eq,`N = ln[(PMT${bgn?'(1+r)':''}/r – FV)/(PV + PMT${bgn?'(1+r)':''}/r)]/ln(1 + r) = ${N(res,4)}`]}
  if(k==='IY'){const rs=roots(x=>f(n,x,pv,pmt,fv),-0.99,1.5,0.0005);res=rs.length?(rs.find(x=>x>0)??rs[0])*100:NaN;txt=[eq,`Solve for r by trial and error (financial calculator): r = ${N(res,4)}% per period`]}
  $('#tvm-'+k).value=isFinite(res)?(+res.toFixed(k==='N'||k==='IY'?4:2)):'';$('#tvm-'+k).classList.add('hit');setTimeout(()=>$('#tvm-'+k).classList.remove('hit'),900);
  $('#tvm-lab').textContent=(k==='IY'?'I/Y':k)+' 계산 결과';$('#tvm-out').textContent=isFinite(res)?(k==='IY'?N(res,4)+'%':N(res,k==='N'?4:2)):'해 없음 — 부호 확인';
  $('#tvm-steps').innerHTML=txt.map(s=>`<div>${esc(s)}</div>`).join('')})}

function cfHTML(){return `<article class="card" id="cfw"><header><span class="ref">CF</span><h3>현금흐름 워크시트 (NPV · IRR · Payback · PI)</h3></header>
 <p class="prompt">계산기의 CF 기능처럼, 0년부터 현금흐름을 쉼표로 넣으세요. 어떤 프로젝트든 바로 검산할 수 있습니다.</p>

 const rows=[['NPV',M(n)],['IRR',ir.length?ir.map(x=>P(x)).join(' / '):'none'],['Payback',isFinite(pb)?N(pb,2)+' yrs':'never'],['Discounted payback',isFinite(dpb)?N(dpb,2)+' yrs':'never'],['PI',N(pi,3)]];

 const hi=Math.max(0.3,...ir.filter(x=>x>0).map(x=>x*1.3));$('#cfw-chart').innerHTML=npvChart([{cf,name:'NPV'}],Math.min(0,...ir.map(x=>x-0.05)),Math.min(hi,2))};

 <div style="font-family:var(--f-body);font-size:13px;color:var(--ink2)">부호 규칙: 내는 돈 –, 받는 돈 +. PV를 구하면 음수로 나오는 게 정상입니다. 공학용 계산기는 Casio fx-570 기준이며 <kbd>Ans</kbd>, <kbd>STO</kbd>/<kbd>RCL</kbd>, STAT 모드를 씁니다.</div></div></div>
 ${earHTML()}
 <div class="pane"><h3>시험 범위 <small>RWJJ 12th ed. · 교수님 지정 문제</small></h3><div class="mono" style="display:grid;gap:4px" id="scope"></div></div>
 </section>`}

function build(){const main=$('main .wrap');let h=homeHTML()+taHTML();
 CH.filter(c=>c.num).forEach(c=>{h+=`<section class="view" id="v-${c.id}" hidden><div class="chhead"><span class="num">${c.num}</span><h2>${c.title}</h2></div>${conceptHTML(c)}`;
  if(c.id==='ch1')h+=`<div class="qa">${CH1QA.map(q=>`<details><summary><span class="ref">${q[0]}</span><span>${q[1]} — <span style="font-weight:400;color:var(--ink2)">${esc(q[2])}</span></span></summary><p class="en" lang="en">${esc(q[3])}</p><p class="ko">${q[4]}</p></details>`).join('')}</div>`;
  if(c.id==='ch5')h+=cfHTML();
  CALCS.filter(x=>x.ch===c.id).forEach(x=>{vals[x.id]={};x.inputs.forEach(i=>vals[x.id][i.k]=i.v);h+=cardHTML(x)});h+='</section>'});
 h+=`<section class="view" id="v-sheet" hidden><div class="chhead"><span class="num">FORMULA SHEET</span><h2>한 장 공식집</h2></div><div class="sheet">${CH.filter(c=>c.fx).map(c=>`<div class="pane"><h3>${c.tab} <small>${esc(c.title)}</small></h3><div class="fx">${c.fx.map(f=>`<div><span>${f[0]}</span><code>${esc(f[1])}</code></div>`).join('')}</div></div>`).join('')}</div></section>`;
 main.innerHTML=h;
 $('#scope').innerHTML=CH.filter(c=>c.num).map(c=>{const ps=c.id==='ch1'?CH1QA.map(q=>q[0]):CALCS.filter(x=>x.ch===c.id).map(x=>x.ref);return `<div><b>${c.tab}</b> ${esc(c.title)} — ${ps.join(', ')}</div>`}).join('');
 CALCS.forEach(c=>{wireCard(c);update(c)});taWire();tvmWire();earWire();cfWire();
 const nav=$('nav.tabs .wrap');nav.innerHTML=CH.map(c=>`<button role="tab" data-v="${c.id}" aria-selected="false">${c.tab}<span class="ct"></span></button>`).join('');
 nav.addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.v,true)});
 $('#nCalc').textContent=CALCS.length;refreshCounts();const start=(location.hash||'').slice(1);show(CH.some(c=>c.id===start)?start:store.get('cf-tab','home'),false)}
function show(id,scroll){document.querySelectorAll('section.view').forEach(s=>s.hidden=s.id!=='v-'+id);document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===id));store.set('cf-tab',id);if(scroll)window.scrollTo({top:0})}
function refreshCounts(){document.querySelectorAll('nav.tabs button').forEach(b=>{const xs=CALCS.filter(x=>x.ch===b.dataset.v);if(xs.length)$('.ct',b).textContent=xs.filter(x=>solved.has(x.id)).length+'/'+xs.length});
 const t=$('#solvedTotal');if(t)t.textContent=`${[...solved].filter(id=>CALCS.some(c=>c.id===id)).length} / ${CALCS.length}`}
build();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
