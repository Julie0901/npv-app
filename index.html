<style>
/* Layout: a financial-calculator workbench — paper page, dark calculator bodies with gold keys and an LCD readout */
:root{

  --good:#2E7A4D; --bad:#B23F2E; --goodbg:#DCEBDF; --badbg:#F2DCD7;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-lcd:"Share Tech Mono","IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#131614; --paper2:#1A1E1C; --card:#1C201E; --ink:#E3E8E2; --ink2:#A2ADA6; --line:#2F3632;
  --body:#262C29; --body2:#303733; --key:#3D4541; --keyink:#EEF1EC; --keylab:#A7B2AB;
  --gold:#D3A042; --goldink:#1E1607; --goldsoft:#4A3B1D;
  --lcd:#A2AD8C; --lcdink:#1A2413; --lcddim:#56624A;
  --good:#63BE88; --bad:#E77560; --goodbg:#1D3326; --badbg:#3A221D; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131614; --paper2:#1A1E1C; --card:#1C201E; --ink:#E3E8E2; --ink2:#A2ADA6; --line:#2F3632;
  --body:#262C29; --body2:#303733; --key:#3D4541; --keyink:#EEF1EC; --keylab:#A7B2AB;
  --gold:#D3A042; --goldink:#1E1607; --goldsoft:#4A3B1D;
  --lcd:#A2AD8C; --lcdink:#1A2413; --lcddim:#56624A;
  --good:#63BE88; --bad:#E77560; --goodbg:#1D3326; --badbg:#3A221D; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* header */
.top{padding-block:28px 18px;border-bottom:1px solid var(--line)}
.top .eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--ink2);text-transform:uppercase}
.top h1{font-size:clamp(30px,5.4vw,52px);font-weight:800;font-stretch:72%;letter-spacing:-.01em;margin-top:6px}
.top h1 em{font-style:normal;color:var(--gold)}
.top p{margin:8px 0 0;color:var(--ink2);max-width:62ch}
.statusline{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px;font-family:var(--f-mono);font-size:12.5px;color:var(--ink2)}
.statusline b{color:var(--ink);font-weight:600}

/* nav */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:8px;scrollbar-width:thin}

nav.tabs button:hover{color:var(--ink);border-color:var(--line)}
nav.tabs button[aria-selected="true"]{background:var(--body);color:var(--keyink);border-color:var(--body)}

main{padding-block:26px 80px}
section.view{display:grid;gap:22px}
.chhead{display:grid;gap:6px}

.pane{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;min-width:0}
.pane h3{font-size:16px;font-weight:700;font-stretch:90%;margin-bottom:10px;display:flex;gap:8px;align-items:baseline}
.pane h3 small{font-family:var(--f-mono);font-weight:400;font-size:11.5px;color:var(--ink2);letter-spacing:.04em}

.fx{display:grid;gap:8px}

.card>header{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:14px 18px 0}
.ref{font-family:var(--f-mono);font-size:12px;font-weight:600;background:var(--body);color:var(--gold);padding:3px 8px;border-radius:4px;letter-spacing:.03em}

.in{display:grid;gap:3px;min-width:0}

.btns{display:flex;flex-wrap:wrap;gap:8px}

.pr{display:grid;gap:8px}

.ans{margin-top:12px;padding:10px 12px;border-radius:6px;background:var(--paper2);border-left:3px solid var(--good);font-size:14px}

.card.practice:not(.revealed) .sol .steps,.card.practice:not(.revealed) .sol .ans{filter:blur(6px);user-select:none;pointer-events:none}

.chart{padding:4px 18px 14px;min-width:0}

.chart .axis{stroke:var(--line)} .chart .zero{stroke:var(--ink2);stroke-dasharray:3 3}
.chart text{fill:var(--ink2);font:11px var(--f-mono)}
.chart .s0{stroke:var(--gold);fill:none;stroke-width:2.5}

/* home */

.ord{counter-reset:s;display:grid;gap:10px;margin:0;padding:0;list-style:none}

/* TA review */
kbd{font:600 12px var(--f-mono);background:var(--body);color:var(--keyink);border-radius:4px;padding:1px 6px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35);white-space:nowrap}
.tajump{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.tajump a{text-decoration:none}
.card.ta>header .btn{margin-left:auto}
.tagoal{margin:0 18px 10px;padding:10px 12px;background:var(--paper2);border-radius:6px;font-size:14px}

pre.tl{margin:0 18px 14px;padding:12px 14px;background:var(--body);color:var(--lcd);border-radius:6px;font:13px/1.6 var(--f-mono);overflow-x:auto;white-space:pre}

<header class="top"><div class="wrap">
<div class="eyebrow">KAIST · Corporate Finance BAF501K · Midterm</div>
<h1>기업재무 <em>NPV</em> 연습장</h1>
<p>교수님 지정 문제(RWJJ 12th ed.) 전부를 계산기 지름길로 풀어볼 수 있게 만들었습니다. 1단계 → 2단계 키 입력을 따라 하고, 숫자를 바꿔 새 문제로 연습하세요.</p>
<div class="statusline"><span>계산 문제 <b id="nCalc">37</b>개 (전부 계산기 지름길) + 개념 <b>6</b> + TA 리뷰 <b>5</b></span><span>맞힌 문제 <b id="solvedTotal">0 / 37</b></span><span>연습 기록은 이 브라우저에만 저장됩니다</span></div>
</div></header>
<nav class="tabs" aria-label="Chapters"><div class="wrap" role="tablist"></div></nav>
<main><div class="wrap"></div></main>
<script>
/* ===== CORE: math + problem definitions (no DOM) ===== */
const pvif=(r,n)=>Math.pow(1+r,-n);
const pvifa=(r,n)=>Math.abs(r)<1e-12?n:(1-Math.pow(1+r,-n))/r;
const fvifa=(r,n)=>Math.abs(r)<1e-12?n:(Math.pow(1+r,n)-1)/r;
const npv=(r,cf)=>cf.reduce((s,c,t)=>s+c/Math.pow(1+r,t),0);
function bisect(f,lo,hi){let flo=f(lo);for(let i=0;i<300;i++){const m=(lo+hi)/2,fm=f(m);if(fm===0)return m;if((fm>0)===(flo>0)){lo=m;flo=fm}else hi=m;if(hi-lo<1e-13)break}return (lo+hi)/2}
function roots(f,lo,hi,step){const out=[];let x0=lo,f0=f(x0);const n=Math.round((hi-lo)/step);for(let i=1;i<=n;i++){const x=lo+i*step,f1=f(x);if(isFinite(f0)&&isFinite(f1)){if(f0===0)out.push(x0);else if(f0*f1<0)out.push(bisect(f,x0,x))}x0=x;f0=f1}
  return out.filter((v,i,a)=>i===0||Math.abs(v-a[i-1])>1e-6)}
const irrs=(cf,lo=-0.95,hi=3)=>roots(r=>npv(r,cf),lo,hi,0.0005);
function irr1(cf){const a=irrs(cf);if(!a.length)return NaN;const p=a.filter(x=>x>0);return p.length?p[0]:a[0]}
function payback(cf,r=0){let cum=cf[0];if(cum>=0)return 0;for(let t=1;t<cf.length;t++){const c=cf[t]/Math.pow(1+r,t);if(c>0&&cum+c>=0)return t-1+(-cum)/c;cum+=c}return Infinity}
const parseNum=s=>{s=String(s).replace(/[,$\s]/g,'').replace(/[–−]/g,'-');if(s.includes('/')){const[a,b]=s.split('/');return parseFloat(a)/parseFloat(b)}return parseFloat(s)};
const parseList=s=>String(s).split(/[;,\s]+/).filter(x=>x.length).map(parseNum);

/* formatting */
const M=(x,d=2)=>!isFinite(x)?(x>0?'∞':'n/a'):(x<-1e-9?'–':'')+'$'+Math.abs(x).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const M0=x=>M(x,0);
const P=(x,d=2)=>!isFinite(x)?'n/a':(x<0?'–':'')+Math.abs(x*100).toFixed(d)+'%';
const N=(x,d=4)=>!isFinite(x)?(x>0?'∞':'n/a'):(x<0?'–':'')+Math.abs(x).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const D=x=>{const s=String(+x.toFixed(6));return s.startsWith('0.')?s.slice(1):s.startsWith('-0.')?'–'+s.slice(2):s};   /* .079 style */
const pc=x=>String(+(+x).toFixed(4))+'%';
const o=(l,v,f,key,d)=>({l,v,f,key:!!key,d});

const CALCS=[];
const Cx=o2=>CALCS.push(o2);
const I=(k,l,t,v,x={})=>Object.assign({k,l,t,v},x);

/* ---------- CH 2 ---------- */
Cx({ch:'ch2',id:'p2-17',ref:'2-17 · 2-18',title:'Net income, OCF, and the change in long-term debt',
inputs:[I('s','Sales','$',630000),I('cogs','COGS','$',465000),I('sga','Admin & selling exp.','$',85000),I('dep','Depreciation','$',135000),I('int','Interest expense','$',70000),I('t','Tax rate','%',21),I('div','Dividends paid','$',34000),I('ncs','Net capital spending','$',0,{fixed:1}),I('dnwc','Change in NWC','$',0,{fixed:1}),I('neq','Net new equity','$',0,{fixed:1})],
prompt:v=>`During the year, a firm had sales of ${M0(v.s)}. Cost of goods sold, administrative and selling expenses, and depreciation were ${M0(v.cogs)}, ${M0(v.sga)}, and ${M0(v.dep)}. Interest expense was ${M0(v.int)} and the tax rate is ${pc(v.t)} (interest is fully deductible). (a) What is net income? (b) What is operating cash flow? (c) The firm paid ${M0(v.div)} in cash dividends. If net capital spending was ${M0(v.ncs)}, the change in NWC was ${M0(v.dnwc)}, and no new stock was issued (net new equity ${M0(v.neq)}), what was the change in long-term debt?`,
compute:v=>{const t=v.t/100,ebit=v.s-v.cogs-v.sga-v.dep,ti=ebit-v.int,tax=Math.max(0,ti*t),ni=ti-tax,ocf=ebit+v.dep-tax,cfa=ocf-v.dnwc-v.ncs,cfs=v.div-v.neq,cfc=cfa-cfs,nld=v.int-cfc;
return{out:[o('Net income',ni,'$',1),o('Operating cash flow',ocf,'$',1),o('Net new LTD',nld,'$',1),o('EBIT',ebit,'$'),o('Taxes',tax,'$'),o('Cash flow from assets',cfa,'$'),o('CF to creditors',cfc,'$')],
steps:['## (a) Income statement',`EBIT = Sales – COGS – A&S – Depreciation`,`EBIT = ${M0(v.s)} – ${M0(v.cogs)} – ${M0(v.sga)} – ${M0(v.dep)} = ${M0(ebit)}`,`Taxable income = EBIT – Interest = ${M0(ebit)} – ${M0(v.int)} = ${M0(ti)}`,
ti<0?`Taxes = $0 (taxable income is negative, so no tax is paid)`:`Taxes = ${pc(v.t)} × ${M0(ti)} = ${M(tax)}`,`Net income = ${M(ni)}`,
'## (b) Operating cash flow',`OCF = EBIT + Depreciation – Taxes`,`OCF = ${M0(ebit)} + ${M0(v.dep)} – ${M(tax)} = ${M(ocf)}`,
'## (c) Cash flow identity',`CFA = OCF – ΔNWC – Net capital spending = ${M(ocf)} – ${M0(v.dnwc)} – ${M0(v.ncs)} = ${M(cfa)}`,`CF to stockholders = Dividends – Net new equity = ${M0(v.div)} – ${M0(v.neq)} = ${M(cfs)}`,`CF to creditors = CFA – CF to stockholders = ${M(cfa)} – ${M(cfs)} = ${M(cfc)}`,`CF to creditors = Interest – Net new LTD  →  Net new LTD = ${M0(v.int)} – ${M(cfc)} = ${M(nld)}`],
answer:`Net income is ${M(ni)}, while OCF is ${M(ocf)}. ${ni<0&&ocf>0?'Net income is negative because depreciation and interest are tax-deductible, but OCF is positive because depreciation is a non-cash expense and interest is a financing cost, not an operating cost. ':''}A firm can pay dividends even with negative net income as long as it has enough cash flow. Long-term debt ${nld>=0?'increased':'decreased'} by ${M(Math.abs(nld))}.`}}});

Cx({ch:'ch2',id:'p2-19',ref:'2-19',title:'Calculating cash flows (CFA, creditors, stockholders)',
inputs:[I('s','Sales','$',24360),I('cogs','COGS','$',17600),I('dep','Depreciation','$',3400),I('int','Interest expense','$',860),I('div','Dividends paid','$',790),I('t','Tax rate','%',21),I('nfa0','Net fixed assets (beg)','$',18650),I('nfa1','Net fixed assets (end)','$',21180),I('ca0','Current assets (beg)','$',5560),I('ca1','Current assets (end)','$',6410),I('cl0','Current liab. (beg)','$',3040),I('cl1','Current liab. (end)','$',3445),I('nd','Net new debt','$',0,{fixed:1})],
prompt:v=>`A firm had the following results: sales = ${M0(v.s)}; COGS = ${M0(v.cogs)}; depreciation = ${M0(v.dep)}; interest = ${M0(v.int)}; dividends = ${M0(v.div)}. At the beginning of the year, net fixed assets were ${M0(v.nfa0)}, current assets ${M0(v.ca0)}, and current liabilities ${M0(v.cl0)}. At year end: net fixed assets ${M0(v.nfa1)}, current assets ${M0(v.ca1)}, current liabilities ${M0(v.cl1)}. Tax rate = ${pc(v.t)}. (a) Net income? (b) OCF? (c) Cash flow from assets? (d) If net new debt was ${M0(v.nd)}, what are the cash flows to creditors and to stockholders?`,
compute:v=>{const t=v.t/100,ebit=v.s-v.cogs-v.dep,ti=ebit-v.int,tax=Math.max(0,ti*t),ni=ti-tax,ocf=ebit+v.dep-tax,nwc0=v.ca0-v.cl0,nwc1=v.ca1-v.cl1,dnwc=nwc1-nwc0,ncs=v.nfa1-v.nfa0+v.dep,cfa=ocf-dnwc-ncs,cfc=v.int-v.nd,cfs=cfa-cfc,neq=v.div-cfs;
return{out:[o('Net income',ni,'$',1),o('OCF',ocf,'$',1),o('Cash flow from assets',cfa,'$',1),o('CF to creditors',cfc,'$',1),o('CF to stockholders',cfs,'$',1),o('ΔNWC',dnwc,'$'),o('Net capital spending',ncs,'$'),o('Net new equity',neq,'$')],
steps:['## (a) Net income',`EBIT = ${M0(v.s)} – ${M0(v.cogs)} – ${M0(v.dep)} = ${M0(ebit)}`,`Taxable income = ${M0(ebit)} – ${M0(v.int)} = ${M0(ti)}`,`Taxes = ${pc(v.t)} × ${M0(ti)} = ${M(tax)}`,`Net income = ${M(ni)}`,
'## (b) OCF',`OCF = EBIT + Depreciation – Taxes = ${M0(ebit)} + ${M0(v.dep)} – ${M(tax)} = ${M(ocf)}`,
'## (c) Cash flow from assets',`ΔNWC = (CA_end – CL_end) – (CA_beg – CL_beg) = (${M0(v.ca1)} – ${M0(v.cl1)}) – (${M0(v.ca0)} – ${M0(v.cl0)}) = ${M0(nwc1)} – ${M0(nwc0)} = ${M0(dnwc)}`,`Net capital spending = NFA_end – NFA_beg + Depreciation = ${M0(v.nfa1)} – ${M0(v.nfa0)} + ${M0(v.dep)} = ${M0(ncs)}`,`CFA = OCF – ΔNWC – NCS = ${M(ocf)} – ${M0(dnwc)} – ${M0(ncs)} = ${M(cfa)}`,
'## (d) Creditors and stockholders',`CF to creditors = Interest – Net new LTD = ${M0(v.int)} – ${M0(v.nd)} = ${M(cfc)}`,`CF to stockholders = CFA – CF to creditors = ${M(cfa)} – ${M(cfc)} = ${M(cfs)}`,`CF to stockholders = Dividends – Net new equity  →  Net new equity = ${M0(v.div)} – (${M(cfs)}) = ${M(neq)}`],
answer:`Net income (${M(ni)}) and OCF (${M(ocf)}) are positive. CFA is ${M(cfa)}${cfa<0?': negative CFA is possible because the firm invested heavily in fixed assets and NWC, so it had to raise funds on a net basis from stockholders and creditors':''}. Cash flow to creditors is ${M(cfc)} and cash flow to stockholders is ${M(cfs)}${cfs<0?', meaning the firm raised '+M(neq)+' of new equity, more than it paid out in dividends':''}.`}}});

/* ---------- CH 4 ---------- */
Cx({ch:'ch4',id:'p4-52',ref:'4-52',title:'Annuities: saving for two children’s college',
inputs:[I('c','Cost per year per child','$',72000),I('n','Years of college','int',4),I('r','Interest rate','%',7.9),I('a','Oldest starts in year','int',15),I('b','Youngest starts in year','int',17)],
prompt:v=>`You are saving for your two children's college education. One begins college ${v.a} years from today and the other ${v.b} years from today. Expenses are ${M0(v.c)} per year per child, paid at the beginning of each school year, for ${v.n} years each. The interest rate is ${pc(v.r)}. You make equal annual deposits starting one year from today, with the last deposit when the oldest child enters college. How much must you deposit each year?`,
compute:v=>{const r=v.r/100,pva=v.c*pvifa(r,v.n),pv1=pva*pvif(r,v.a-1),pv2=pva*pvif(r,v.b-1),tot=pv1+pv2,pmt=tot/pvifa(r,v.a);
return{out:[o('Annual deposit (C)',pmt,'$',1),o('PV of college cost, one child (at year '+(v.a-1)+')',pva,'$'),o('Total cost today',tot,'$',1)],
steps:['## Step 1. PV of one child’s expenses (an annuity)',`PVA = C × {1 – [1/(1 + r)]^t}/r = ${M0(v.c)} × {1 – [1/(1 + ${D(r)})]^${v.n}}/${D(r)} = ${M(pva)}`,`This is the value one year before each child enters college (year ${v.a-1} and year ${v.b-1}).`,
'## Step 2. Discount each to today',`Oldest: PV = ${M(pva)}/(1 + ${D(r)})^${v.a-1} = ${M(pv1)}`,`Youngest: PV = ${M(pva)}/(1 + ${D(r)})^${v.b-1} = ${M(pv2)}`,`Total cost today = ${M(pv1)} + ${M(pv2)} = ${M(tot)}`,
'## Step 3. Solve for the annual deposit',`${M(tot)} = C × {1 – [1/(1 + ${D(r)})]^${v.a}}/${D(r)}`,`C = ${M(tot)}/${N(pvifa(r,v.a))} = ${M(pmt)}`],
answer:`You must deposit ${M(pmt)} per year for ${v.a} years.`}}});

Cx({ch:'ch4',id:'p4-55',ref:'4-55',title:'Growing annuity: what % of salary to save',
inputs:[I('T','Years to retirement','int',30),I('fv','Retirement goal','$',2500000),I('s','Salary at end of year 1','$',86000),I('g','Salary growth','%',3),I('r','Return on investment','%',9.4)],
prompt:v=>`You have ${v.T} years left until retirement and want to retire with ${M0(v.fv)}. You will receive a salary of ${M0(v.s)} at the end of this year, growing at ${pc(v.g)} per year. You can earn ${pc(v.r)} on your investments. If you save a constant percentage of your salary, what percentage must you save each year?`,
compute:v=>{const r=v.r/100,g=v.g/100,pv=v.fv*pvif(r,v.T),f=(1/(r-g))*(1-Math.pow((1+g)/(1+r),v.T)),c=pv/f,pct=c/v.s;
return{out:[o('Savings rate',pct,'%',1),o('First-year savings (C)',c,'$',1),o('PV of goal',pv,'$')],
steps:['## Step 1. PV of the retirement goal',`PV = FV/(1 + r)^t = ${M0(v.fv)}/(1 + ${D(r)})^${v.T} = ${M(pv)}`,
'## Step 2. Growing annuity — solve for the first payment',`PV = C × {[1/(r – g)] – [1/(r – g)] × [(1 + g)/(1 + r)]^t}`,`${M(pv)} = C × {[1/(${D(r)} – ${D(g)})] × [1 – (${D(1+g)}/${D(1+r)})^${v.T}]} = C × ${N(f)}`,`C = ${M(c)}`,
'## Step 3. As a percentage of salary',`Percentage = ${M(c)}/${M0(v.s)} = ${N(pct,4)}, or ${P(pct)}`],
answer:`You must save ${P(pct)} of your salary each year. Because salary and savings both grow at ${pc(v.g)}, the percentage stays constant.`}}});

Cx({ch:'ch4',id:'p4-56',ref:'4-56',title:'Balloon payment: paying off a loan early',
inputs:[I('p','Purchase price','$',17000),I('dn','Down payment','$',1500),I('apr','APR (monthly comp.)','%',6.8),I('y','Loan term (years)','int',5),I('m','Payments already made','int',25),I('pen','Prepayment penalty','%',1)],
prompt:v=>`You buy a motorcycle for ${M0(v.p)}, pay ${M0(v.dn)} down, and finance the balance with a ${v.y}-year loan at ${pc(v.apr)} APR compounded monthly. Payments start one month after purchase. After ${v.m} payments, you decide to pay off the loan on the next payment date. If the bank charges a ${pc(v.pen)} prepayment penalty on the loan balance, how much must you pay on that date?`,
compute:v=>{const i=v.apr/1200,n=v.y*12,L=v.p-v.dn,pmt=L/pvifa(i,n),rem=n-v.m-1,bal=pmt*pvifa(i,rem),tot=bal*(1+v.pen/100)+pmt;
return{out:[o('Total payment on payoff date',tot,'$',1),o('Monthly payment',pmt,'$',1),o('Remaining balance',bal,'$')],
steps:['## Step 1. Monthly payment',`Amount borrowed = ${M0(v.p)} – ${M0(v.dn)} = ${M0(L)}`,`${M0(L)} = C × {1 – [1/(1 + ${D(v.apr/100)}/12)]^${n}}/(${D(v.apr/100)}/12)`,`C = ${M(pmt)}`,
'## Step 2. Remaining balance',`${v.m} payments made; on the payoff date one more payment is due, leaving ${n} – ${v.m} – 1 = ${rem} payments after it.`,`Balance = ${M(pmt)} × {1 – [1/(1 + ${D(v.apr/100)}/12)]^${rem}}/(${D(v.apr/100)}/12) = ${M(bal)}`,
'## Step 3. Total payment',`Total = Balance × (1 + penalty) + current payment = ${M(bal)} × (1 + ${D(v.pen/100)}) + ${M(pmt)} = ${M(tot)}`],
answer:`She must pay ${M(tot)} on the payoff date.`}}});

Cx({ch:'ch4',id:'p4-65',ref:'4-65',title:'Number of periods: credit-card balance transfer',
inputs:[I('pv','Balance','$',12000),I('c','Monthly payment','$',250),I('a1','Current card APR','%',18.6),I('a2','New card APR','%',8.2),I('fee','Transfer fee','%',2)],
prompt:v=>`You have a ${M0(v.pv)} credit card balance at ${pc(v.a1)} APR. A new card offers ${pc(v.a2)} APR. How much faster could you pay off the balance with your planned monthly payments of ${M0(v.c)} on the new card? What if there is a ${pc(v.fee)} fee on balances transferred?`,
compute:v=>{const t=(pv,apr)=>{const i=apr/1200,x=1-pv*i/v.c;return x<=0?Infinity:-Math.log(x)/Math.log(1+i)};const t1=t(v.pv,v.a1),t2=t(v.pv,v.a2),pvf=v.pv*(1+v.fee/100),t3=t(pvf,v.a2);
const ln=(pv,apr)=>{const i=apr/1200;return `t = ln{1/[1 – (${M0(pv)}/${M0(v.c)})(${N(i,6)})]}/ln(${N(1+i,6)}) = ${N(t(pv,apr),2)} months`};
return{out:[o('Months faster (no fee)',t1-t2,'n',1,2),o('Months faster (with fee)',t1-t3,'n',1,2),o('Months, current card',t1,'n',0,2),o('Months, new card',t2,'n',0,2),o('Months, new card + fee',t3,'n',0,2)],
steps:['## PVA = C × {[1 – 1/(1 + r)^t]/r}, solve for t',`t = ln{1/[1 – (PV/C)(r)]}/ln(1 + r), with r = APR/12`,'## Current card',ln(v.pv,v.a1),'## New card, no fee',ln(v.pv,v.a2),`Faster by ${N(t1,2)} – ${N(t2,2)} = ${N(t1-t2,2)} months`,'## New card with fee',`Transferred balance = ${M0(v.pv)} × (1 + ${D(v.fee/100)}) = ${M(pvf)}`,ln(pvf,v.a2),`Faster by ${N(t1,2)} – ${N(t3,2)} = ${N(t1-t3,2)} months`],
answer:`Without a fee you pay off the balance ${N(t1-t2,2)} months sooner; with the ${pc(v.fee)} fee, ${N(t1-t3,2)} months sooner.`}}});

Cx({ch:'ch4',id:'p4-66',ref:'4-66',title:'FV of multiple cash flows with two interest rates',
inputs:[I('cf','Premiums (birthdays 1, 2, …)','list','500, 600, 700, 800, 900, 1000'),I('r1','Rate during premium years','%',11),I('r2','Rate afterwards','%',7),I('age','Payoff at age','int',65),I('pay','Payoff amount','$',300000)],
prompt:v=>{const c=parseList(v.cf);return `A policy requires payments of ${c.map(M0).join(', ')} on the child's birthdays 1 through ${c.length}. At age ${v.age}, the child receives ${M0(v.pay)}. If the relevant rate is ${pc(v.r1)} for the first ${c.length} years and ${pc(v.r2)} thereafter, is the policy worth buying?`},
compute:v=>{const c=parseList(v.cf),n=c.length,r1=v.r1/100,r2=v.r2/100;let vn=0;const lines=[];c.forEach((x,i)=>{const f=x*Math.pow(1+r1,n-1-i);vn+=f;lines.push(`FV${i+1} = ${M0(x)} × (${D(1+r1)})^${n-1-i} = ${M(f)}`)});
const fv=vn*Math.pow(1+r2,v.age-n),pvPrem=c.reduce((s,x,i)=>s+x*pvif(r1,i+1),0),pvPay=v.pay*pvif(r2,v.age-n)*pvif(r1,n);
return{out:[o('FV of premiums at age '+v.age,fv,'$',1),o('Value at year '+n,vn,'$'),o('PV of premiums',pvPrem,'$'),o('PV of payoff',pvPay,'$')],
steps:[`## Step 1. Value of premiums at year ${n} (rate ${pc(v.r1)})`,...lines,`Value at year ${n} = ${M(vn)}`,`## Step 2. Compound to age ${v.age} (rate ${pc(v.r2)})`,`FV = ${M(vn)} × (${D(1+r2)})^${v.age-n} = ${M(fv)}`,'## Check with present values',`PV of premiums = ${M(pvPrem)};  PV of payoff = ${M0(v.pay)}/(${D(1+r2)})^${v.age-n}/(${D(1+r1)})^${n} = ${M(pvPay)}`],
answer:fv>v.pay?`The policy is not worth buying: the premiums grow to ${M(fv)} by age ${v.age}, which is ${M(fv-v.pay)} more than the ${M0(v.pay)} payoff.`:`The policy is worth buying: the premiums grow to only ${M(fv)}, which is less than the ${M0(v.pay)} payoff.`}}});

Cx({ch:'ch4',id:'p4-68',ref:'4-68',title:'Calculating the rate of return on a savings plan',
inputs:[I('p','Annual payment','$',9000),I('np','Number of payments (first today)','int',6),I('c','Annual benefit','$',20000),I('nc','Number of benefits','int',4),I('st','First benefit in year','int',6)],
prompt:v=>`A college savings program asks you to make ${v.np} annual payments of ${M0(v.p)}, the first one today. Beginning ${v.st} years from today, the plan pays ${M0(v.c)} per year for ${v.nc} years. What return is this investment offering?`,
compute:v=>{const T=Math.max(v.np,v.st+v.nc);const cf=Array(T).fill(0);for(let t=0;t<v.np;t++)cf[t]-=v.p;for(let t=v.st;t<v.st+v.nc;t++)cf[t]+=v.c;const r=irr1(cf);
return{out:[o('Return (IRR)',r,'%',1)],
steps:['## Set PV of benefits = PV of payments',`Cash flows by year: ${cf.map((x,t)=>t+': '+M0(x)).join(' | ')}`,`0 = Σ CF_t/(1 + r)^t`,`Equivalently: ${M0(v.c)} × {1 – [1/(1 + r)]^${v.nc}}/r, discounted ${v.st-1} years  =  ${M0(v.p)} × (annuity due of ${v.np} payments)`,`Solve by trial and error / spreadsheet:  r = ${P(r)}`,`Check: NPV at ${P(r)} = ${M(npv(r,cf))}`],
answer:`The investment offers a return of ${P(r)}.`}}});

Cx({ch:'ch4',id:'p4-69',ref:'4-69',title:'Break-even rate: perpetuity vs. annuity',
inputs:[I('x','Perpetuity payment','$',25000),I('y','Annuity payment','$',51000),I('n','Annuity years','int',10)],
prompt:v=>`Plan X is a ${M0(v.x)} annual perpetuity. Plan Y is a ${v.n}-year, ${M0(v.y)} annual annuity. Both make their first payment one year from today. At what discount rate would you be indifferent between the two plans?`,
compute:v=>{const k=v.x/v.y,r=Math.pow(1-k,-1/v.n)-1;
return{out:[o('Indifference rate',r,'%',1)],
steps:['## Set the two PVs equal',`PV(perpetuity) = ${M0(v.x)}/r`,`PV(annuity) = ${M0(v.y)} × {1 – [1/(1 + r)]^${v.n}}/r`,`${M0(v.x)}/r = ${M0(v.y)} × {1 – [1/(1 + r)]^${v.n}}/r`,`${M0(v.x)}/${M0(v.y)} = ${N(k,5)} = 1 – [1/(1 + r)]^${v.n}`,`1/(1 + r) = (1 – ${N(k,5)})^(1/${v.n}) = ${N(Math.pow(1-k,1/v.n),5)}`,`r = ${N(r,4)}, or ${P(r)}`],
answer:`You are indifferent at a discount rate of ${P(r)}. Above this rate the annuity is worth more; below it, the perpetuity is worth more.`}}});

Cx({ch:'ch4',id:'p4-70',ref:'4-70',title:'Perpetuity paid every other year (daily compounding)',
inputs:[I('c','Payment','$',50000),I('k','Paid every k years','int',2),I('apr','Annual rate','%',9),I('m','Compounding per year','int',365),I('f1','First payment (case 1), year','int',1),I('f2','First payment (case 2), year','int',4)],
prompt:v=>`What is the value of an investment that pays ${M0(v.c)} every ${v.k} years forever, if the first payment occurs ${v.f1} year(s) from today and the discount rate is ${pc(v.apr)} compounded ${v.m===365?'daily':v.m+' times per year'}? What is the value today if the first payment occurs ${v.f2} years from today?`,
compute:v=>{const j=v.apr/100/v.m,Rk=Math.pow(1+j,v.m*v.k)-1,pv=v.c/Rk,a=pv*Math.pow(1+j,v.m*(v.k-v.f1)),b=pv*Math.pow(1+j,v.m*(v.k-v.f2));
const mv=(x,f)=>{const d=v.k-f;return d>=0?`Value today = ${M(pv)} × (1 + ${D(v.apr/100)}/${v.m})^(${v.m}×${d}) = ${M(x)}  (compound ${d} yr forward)`:`Value today = ${M(pv)}/(1 + ${D(v.apr/100)}/${v.m})^(${v.m}×${-d}) = ${M(x)}  (discount ${-d} yr)`};
return{out:[o('Value today (case 1)',a,'$',1),o('Value today (case 2)',b,'$',1),o(`Effective ${v.k}-year rate`,Rk,'%')],
steps:[`## Step 1. Effective ${v.k}-year rate`,`R = [1 + (${D(v.apr/100)}/${v.m})]^(${v.m}×${v.k}) – 1 = ${N(Rk,4)}, or ${P(Rk)}`,'## Step 2. Perpetuity formula',`PV = C/R = ${M0(v.c)}/${N(Rk,4)} = ${M(pv)}`,`Remember: this is the value one period (${v.k} years) before the first payment.`,`## Case 1: first payment in year ${v.f1}`,`The perpetuity value is at year ${v.f1-v.k}.`,mv(a,v.f1),`## Case 2: first payment in year ${v.f2}`,`The perpetuity value is at year ${v.f2-v.k}.`,mv(b,v.f2)],
answer:`The investment is worth ${M(a)} today if the first payment is in year ${v.f1}, and ${M(b)} if the first payment is in year ${v.f2}.`}}});

/* ---------- CH 5 ---------- */
Cx({ch:'ch5',id:'p5-18',ref:'5-18',title:'Comparing investment criteria (payback, NPV, IRR, incremental IRR)',
inputs:[I('a','Project A cash flows (Y0…)','list','-1500000, 900000, 700000, 725000'),I('b','Project B cash flows (Y0…)','list','-650000, 345000, 570000, 360000'),I('r','Discount rate','%',8)],
prompt:v=>{const a=parseList(v.a),b=parseList(v.b);return `Consider two mutually exclusive projects with a discount rate of ${pc(v.r)}. Project A (Dry Prepreg): ${a.map(M0).join(', ')}. Project B (Solvent Prepreg): ${b.map(M0).join(', ')} (Years 0, 1, 2, …). (a) Which project is chosen by payback? (b) By NPV? (c) By IRR? (d) Is incremental IRR analysis necessary? If yes, conduct it.`},
compute:v=>{const a=parseList(v.a),b=parseList(v.b),r=v.r/100;const pa=payback(a),pb=payback(b),na=npv(r,a),nb=npv(r,b),ia=irr1(a),ib=irr1(b);const big=Math.abs(a[0])>=Math.abs(b[0]);const L=big?a:b,S=big?b:a,Ln=big?'A':'B',Sn=big?'B':'A';const T=Math.max(L.length,S.length);const inc=Array.from({length:T},(_,t)=>(L[t]||0)-(S[t]||0));const ii=irr1(inc);
const npvLine=(x,nm)=>`NPV_${nm} = ${M0(x[0])} + `+x.slice(1).map((c,t)=>`${M0(c)}/${D(1+r)}^${t+1}`).join(' + ')+` = ${M(npv(r,x))}`;
const pbLine=(x,nm)=>{let cum=0;const p=payback(x);const t=Math.floor(p);for(let i=1;i<=t;i++)cum+=x[i];return isFinite(p)?`Payback_${nm} = ${t} + (${M0(-x[0]-cum)}/${M0(x[t+1])}) = ${N(p,2)} years`:`Payback_${nm}: never`};
const choose=(x,y,hi)=>hi?(x>y?'A':'B'):(x<y?'A':'B');
const needInc=(ia>ib)!==(na>nb);
return{out:[o('NPV A',na,'$',1),o('NPV B',nb,'$',1),o('IRR A',ia,'%',1),o('IRR B',ib,'%',1),o('Incremental IRR ('+Ln+'–'+Sn+')',ii,'%',1),o('Payback A',pa,'yr',0,2),o('Payback B',pb,'yr',0,2),o('PI A',1+na/-a[0],'n',0,3),o('PI B',1+nb/-b[0],'n',0,3)],
steps:['## (a) Payback period',pbLine(a,'A'),pbLine(b,'B'),`Payback chooses Project ${choose(pa,pb,false)} (shorter payback). Payback does not necessarily rank projects correctly.`,
'## (b) NPV',npvLine(a,'A'),npvLine(b,'B'),`NPV chooses Project ${choose(na,nb,true)} (higher NPV).`,
'## (c) IRR',`0 = CF0 + CF1/(1 + IRR) + CF2/(1 + IRR)^2 + …`,`IRR_A = ${P(ia)};  IRR_B = ${P(ib)}`,`IRR chooses Project ${choose(ia,ib,true)}. IRR can rank mutually exclusive projects incorrectly (scale problem).`,
'## (d) Incremental IRR',`Incremental CF (${Ln} – ${Sn}) = ${inc.map(M0).join(', ')}`,`0 = `+inc.map((c,t)=>t?`${M0(c)}/(1 + IRR)^${t}`:M0(c)).join(' + '),`Incremental IRR = ${P(ii)}`,`Rule: for investing-type flows, take the larger project if incremental IRR > discount rate (${pc(v.r)}).`],
answer:`${needInc?'Incremental IRR analysis is necessary because NPV and IRR give conflicting rankings. ':''}The incremental IRR is ${P(ii)}, which is ${ii>r?'greater':'less'} than the ${pc(v.r)} discount rate, so choose Project ${ii>r?Ln:Sn}. This agrees with the NPV rule.`,
chart:{series:[{cf:a,name:'A'},{cf:b,name:'B'}],lo:0,hi:Math.min(1,Math.max(ia,ib)*1.25||.5)}}}});

Cx({ch:'ch5',id:'p5-22',ref:'5-22',title:'NPV and multiple IRRs (quadratic)',
inputs:[I('c0','Cash flow today','$',-75000),I('c1','Cash flow year 1','$',155000),I('c2','Cash flow year 2','$',-65000)],
prompt:v=>`A project has a cash flow of ${M0(v.c0)} today, ${M0(v.c1)} in one year, and ${M0(v.c2)} in two years. What are the IRRs? What discount rate results in the maximum NPV, and how can you tell it is a maximum?`,
compute:v=>{const a=v.c2,b=v.c1,c=v.c0,disc=b*b-4*a*c;let X=[],R=[];if(disc>=0){X=[(-b+Math.sqrt(disc))/(2*a),(-b-Math.sqrt(disc))/(2*a)].sort((x,y)=>x-y);R=X.map(x=>1/x-1)}
const g=-2*a/b,rs=g-1,sd=2*b*Math.pow(g,-3)+6*a*Math.pow(g,-4),cf=[c,b,a];
return{out:[o('IRR 1',R.length?Math.max(...R):NaN,'%',1),o('IRR 2',R.length?Math.min(...R):NaN,'%',1),o('Rate at max NPV',rs,'%',1),o('Max NPV',npv(rs,cf),'$'),o('2nd derivative',sd,'n',0,2)],
steps:['## Set up',`0 = ${M0(c)} + ${M0(b)}/(1 + IRR) + ${M0(a)}/(1 + IRR)^2`,`Descartes’ rule of signs: the cash flows change sign twice, so there are 0 or 2 IRRs.`,`Let X = 1/(1 + IRR):  0 = ${M0(a)}X² + ${M0(b)}X + ${M0(c)}`,
`X = [–b ± √(b² – 4ac)]/(2a),  b² – 4ac = ${N(disc,0)}`,disc<0?'No real roots → no IRR.':`X = ${X.map(x=>N(x,4)).join(', ')}`,...R.map((r,i)=>`IRR = 1/${N(X[i],4)} – 1 = ${P(r)}`),
'## Maximum NPV',`dNPV/dr = –${M0(b)}(1 + r)^–2 – 2(${M0(a)})(1 + r)^–3 = 0`,`(1 + r) = –2(${M0(a)})/${M0(b)} = ${N(g,4)}  →  r = ${P(rs)}`,`Second derivative = 2(${M0(b)})(1 + r)^–3 + 6(${M0(a)})(1 + r)^–4 = ${N(sd,2)}`,sd<0?'Negative second derivative → this is a maximum.':'Positive second derivative → this is a minimum.'],
answer:R.length?`The IRRs are ${P(Math.max(...R))} and ${P(Math.min(...R))}. NPV is maximized at r = ${P(rs)} (second derivative ${sd<0?'negative → maximum':'positive → minimum'}).`:'There is no real IRR.',
chart:{series:[{cf,name:'NPV'}],lo:-0.6,hi:0.8}}}});

Cx({ch:'ch5',id:'p5-23',ref:'5-23',title:'Payback and NPV: worst and best case',
inputs:[I('c','Cost','$',573000),I('pb','Payback (years)','int',6),I('r','Required return','%',11)],
prompt:v=>`An investment has a payback of ${v.pb} years and a cost of ${M0(v.c)}. If the required return is ${pc(v.r)}, what is the worst-case NPV? The best-case NPV? Assume conventional cash flows.`,
compute:v=>{const r=v.r/100,w=-v.c+v.c*pvif(r,v.pb);
return{out:[o('Worst-case NPV',w,'$',1),o('Best-case NPV',Infinity,'$')],
steps:['## Worst case',`All cash flows recovering the cost arrive at the end of year ${v.pb}, and nothing comes after.`,`NPV = –${M0(v.c)} + ${M0(v.c)}/(${D(1+r)})^${v.pb} = ${M(w)}`,'## Best case','The project could have unlimited cash flows after the payback point, so the best-case NPV is infinite.'],
answer:`Worst-case NPV is ${M(w)}; the best-case NPV is infinite. Payback ignores cash flows after the cutoff and the time value of money.`}}});

Cx({ch:'ch5',id:'p5-24',ref:'5-24',title:'Multiple IRRs (four sign changes)',
inputs:[I('cf','Cash flows (Y0…)','list','-6048, 34344, -72840, 68400, -24000'),I('lo','Search from','%',20),I('hi','Search to','%',70)],
prompt:v=>{const c=parseList(v.cf);return `Consider the cash flows ${c.map(M0).join(', ')} (Years 0–${c.length-1}). How many different IRRs are there? (Hint: search between ${pc(v.lo)} and ${pc(v.hi)}.) When should we take this project?`},
compute:v=>{const cf=parseList(v.cf),lo=v.lo/100,hi=v.hi/100;const R=roots(r=>npv(r,cf),lo-0.0001,hi+0.0001,0.0001);let sc=0;for(let i=1;i<cf.length;i++)if(cf[i]*cf[i-1]<0)sc++;
const pts=[lo,...R,hi];const acc=[];for(let i=0;i<pts.length-1;i++){const m=(pts[i]+pts[i+1])/2;if(npv(m,cf)>0)acc.push(`${P(pts[i])} – ${P(pts[i+1])}`)}
return{out:[o('Number of IRRs',R.length,'n',1,0),...R.map((r,i)=>o('IRR '+(i+1),r,'%',1))],
steps:['## Set up',`0 = `+cf.map((c,t)=>t?`${M0(c)}/(1 + IRR)^${t}`:M0(c)).join(' + '),`Descartes’ rule of signs: ${sc} sign changes → up to ${sc} IRRs.`,`Trial and error between ${pc(v.lo)} and ${pc(v.hi)}: IRR = ${R.map(r=>P(r)).join(', ')}`,'## Decision',`Accept when NPV > 0, i.e., when the required return lies in: ${acc.join('  or  ')||'(none in range)'}`],
answer:`There are ${R.length} IRRs: ${R.map(r=>P(r)).join(', ')}. The IRR rule is unreliable here; accept the project only when NPV > 0, which happens for required returns between ${acc.join(' or between ')}.`,
chart:{series:[{cf,name:'NPV'}],lo:Math.max(-.5,lo-0.05),hi:hi+0.05}}}});

/* ---------- CH 6 ---------- */
const MACRS={'MACRS 3-yr':[.3333,.4445,.1481,.0741],'MACRS 5-yr':[.2,.32,.192,.1152,.1152,.0576],'MACRS 7-yr':[.1429,.2449,.1749,.1249,.0893,.0892,.0893,.0446]};
Cx({ch:'ch6',id:'p6-13',ref:'6-13',title:'Cost-cutting proposal with MACRS and NWC',
inputs:[I('c','Machine cost','$',670000),I('sav','Annual pretax cost savings','$',245000),I('n','Project life (years)','int',4),I('dm','Depreciation','sel','MACRS 5-yr',{opts:['MACRS 3-yr','MACRS 5-yr','MACRS 7-yr','Straight-line']}),I('s','Salvage value','$',55000),I('w0','Initial NWC (inventory)','$',20000),I('w1','Extra NWC each later year','$',2500),I('t','Tax rate','%',23),I('r','Discount rate','%',8)],
prompt:v=>`A ${v.n}-year project requires buying a machine for ${M0(v.c)}, producing ${M0(v.sav)} in annual pretax cost savings. The machine is depreciated using ${v.dm==='Straight-line'?'straight-line to zero over the project life':'the '+v.dm.replace('MACRS ','')+' MACRS class'} and has a salvage value of ${M0(v.s)} at the end. The project needs an initial investment of ${M0(v.w0)} in spare-parts inventory plus ${M0(v.w1)} in each succeeding year. The tax rate is ${pc(v.t)} and the discount rate is ${pc(v.r)}. Should the firm buy the machine?`,
compute:v=>{const t=v.t/100,r=v.r/100,n=v.n;const rates=v.dm==='Straight-line'?Array(n).fill(1/n):MACRS[v.dm];const dep=Array.from({length:n},(_,i)=>v.c*(rates[i]||0));const bv=v.c-dep.reduce((a,b)=>a+b,0),ats=v.s+(bv-v.s)*t;
const ocf=dep.map(d=>v.sav*(1-t)+t*d);const rec=v.w0+v.w1*(n-1);const cf=[-v.c-v.w0];for(let i=1;i<=n;i++)cf.push(ocf[i-1]+(i<n?-v.w1:rec+ats));const NPV=npv(r,cf);
return{out:[o('NPV',NPV,'$',1),o('After-tax salvage',ats,'$',1),o('Book value at end',bv,'$'),o('IRR',irr1(cf),'%')],
steps:['## Depreciation',...dep.map((d,i)=>`D${i+1} = ${M0(v.c)} × ${N(rates[i]||0,4)} = ${M(d)}`),`Book value at year ${n} = ${M0(v.c)} – ${M(v.c-bv)} = ${M(bv)}`,
'## After-tax salvage',`ATSV = Salvage + (BV – Salvage) × T = ${M0(v.s)} + (${M(bv)} – ${M0(v.s)}) × ${D(t)} = ${M(ats)}`,bv>v.s?'(Sold below book value → tax refund.)':'(Sold above book value → tax on the gain.)',
'## OCF (tax shield approach)',`OCF = Savings × (1 – T) + T × D`,...ocf.map((x,i)=>`OCF${i+1} = ${M0(v.sav)}(1 – ${D(t)}) + ${D(t)}(${M(dep[i])}) = ${M(x)}`),
'## Net working capital',`Spend ${M0(v.w0)} at year 0 and ${M0(v.w1)} in years 1–${n-1}; recover the total ${M0(rec)} at year ${n}. (The year-${n} addition is recovered immediately, so it nets to zero.)`,
'## NPV',...cf.map((x,i)=>`CF${i} = ${M(x)}`),`NPV = Σ CF_t/(${D(1+r)})^t = ${M(NPV)}`],
answer:`NPV = ${M(NPV)}${NPV>0?' > 0, so the company should buy and install the machine press.':' < 0, so the company should not buy the machine.'}`}}});

Cx({ch:'ch6',id:'p6-18',ref:'6-18',title:'EAC: choosing between machines with different lives',
inputs:[I('ca','Machine A cost','$',1980000),I('la','A life (years)','int',6),I('va','A variable cost (% of sales)','%',35),I('fa','A fixed cost','$',187000),I('cb','Machine B cost','$',5400000),I('lb','B life (years)','int',9),I('vb','B variable cost (% of sales)','%',30),I('fb','B fixed cost','$',145000),I('s','Sales per year','$',12400000),I('r','Required return','%',10),I('t','Tax rate','%',21)],
prompt:v=>`Machine A costs ${M0(v.ca)} and lasts ${v.la} years; variable costs are ${pc(v.va)} of sales and fixed costs are ${M0(v.fa)} per year. Machine B costs ${M0(v.cb)} and lasts ${v.lb} years; variable costs are ${pc(v.vb)} of sales and fixed costs are ${M0(v.fb)}. Sales are ${M0(v.s)} per year for either machine. Required return is ${pc(v.r)}, the tax rate is ${pc(v.t)}, and both use straight-line depreciation. If the machine is replaced forever when it wears out, which should you choose?`,
compute:v=>{const r=v.r/100,t=v.t/100;const f=(c,l,vc,fc)=>{const VC=v.s*vc/100,dep=c/l,ebt=-VC-fc-dep,tax=-ebt*t,ni=ebt+tax,ocf=ni+dep,pv=-c+ocf*pvifa(r,l),eac=pv/pvifa(r,l);return{VC,dep,ebt,tax,ni,ocf,pv,eac}};const A=f(v.ca,v.la,v.va,v.fa),B=f(v.cb,v.lb,v.vb,v.fb);
const blk=(X,nm,c,l,fc)=>[`## Machine ${nm}`,`Variable costs = ${M0(-X.VC)}; Fixed = ${M0(-fc)}; Depreciation = ${M0(c)}/${l} = ${M0(-X.dep)}`,`EBT = ${M0(X.ebt)};  Tax = ${M0(X.tax)} (tax credit);  NI = ${M0(X.ni)}`,`OCF = NI + Depreciation = ${M0(X.ocf)}`,`PV of costs = –${M0(c)} + (${M0(X.ocf)}) × PVIFA(${pc(v.r)}, ${l}) = ${M(X.pv)}`,`EAC = ${M(X.pv)}/PVIFA(${pc(v.r)}, ${l}) = ${M(X.eac)}`];
return{out:[o('EAC A',A.eac,'$',1),o('EAC B',B.eac,'$',1),o('OCF A',A.ocf,'$'),o('OCF B',B.ocf,'$'),o('PV costs A',A.pv,'$'),o('PV costs B',B.pv,'$')],
steps:['Sales are the same for both machines, so they are irrelevant: compare costs only.',...blk(A,'A',v.ca,v.la,v.fa),...blk(B,'B',v.cb,v.lb,v.fb)],
answer:`Choose Machine ${A.eac>B.eac?'A':'B'} because it has the less negative EAC (${M(Math.max(A.eac,B.eac))} vs. ${M(Math.min(A.eac,B.eac))}).`}}});

Cx({ch:'ch6',id:'p6-30',ref:'6-30',title:'Replacement decision: replace now or in five years?',
inputs:[I('os','Old machine: salvage today','$',2800000),I('ob','Old machine: book value today','$',1600000),I('om','Old: annual maintenance','$',855000),I('od','Old: annual depreciation','$',320000),I('oe','Old: salvage in N years','$',140000),I('nc','New machine cost','$',4500000),I('nm','New: annual maintenance','$',350000),I('ne','New: salvage in N years','$',900000),I('n','Horizon N (years)','int',5),I('t','Tax rate','%',21),I('r','Discount rate','%',8)],
prompt:v=>`The old machine could be sold today for ${M0(v.os)}; its book value is ${M0(v.ob)}. If kept, it needs maintenance of ${M0(v.om)} per year for ${v.n} years, is depreciated ${M0(v.od)} per year, and will sell for ${M0(v.oe)} in ${v.n} years (book value then ${M0(Math.max(0,v.ob-v.od*v.n))}). A new machine costs ${M0(v.nc)}, needs ${M0(v.nm)} of maintenance per year, is depreciated straight-line to zero over ${v.n} years, and will sell for ${M0(v.ne)} in ${v.n} years. Tax rate ${pc(v.t)}, discount rate ${pc(v.r)}. Should the company replace the old machine now?`,
compute:v=>{const t=v.t/100,r=v.r/100,n=v.n,A=pvifa(r,n),F=pvif(r,n);const nd=v.nc/n,nocf=-v.nm*(1-t)+t*nd,nats=v.ne-(v.ne-0)*t,NPVn=-v.nc+nocf*A+nats*F;
const obe=Math.max(0,v.ob-v.od*n),oi=-(v.os-(v.os-v.ob)*t),oocf=-v.om*(1-t)+t*v.od,oats=v.oe-(v.oe-obe)*t,NPVo=oi+oocf*A+oats*F;
return{out:[o('NPV (buy new)',NPVn,'$',1),o('NPV (keep old)',NPVo,'$',1),o('Incremental NPV',NPVn-NPVo,'$',1),o('OCF new',nocf,'$'),o('OCF old',oocf,'$')],
steps:['## Option 1: Buy the new machine',`Depreciation = ${M0(v.nc)}/${n} = ${M0(nd)}`,`OCF = –Maintenance × (1 – T) + T × D = –${M0(v.nm)}(1 – ${D(t)}) + ${D(t)}(${M0(nd)}) = ${M(nocf)}`,`After-tax salvage = ${M0(v.ne)} – ${D(t)}(${M0(v.ne)} – 0) = ${M(nats)}`,`NPV = –${M0(v.nc)} + (${M(nocf)}) × PVIFA(${pc(v.r)}, ${n}) + ${M(nats)}/${D(1+r)}^${n} = ${M(NPVn)}`,
'## Option 2: Keep the old machine',`Initial cost = opportunity cost of not selling: –[${M0(v.os)} – ${D(t)}(${M0(v.os)} – ${M0(v.ob)})] = ${M(oi)}`,`OCF = –${M0(v.om)}(1 – ${D(t)}) + ${D(t)}(${M0(v.od)}) = ${M(oocf)}`,`After-tax salvage = ${M0(v.oe)} – ${D(t)}(${M0(v.oe)} – ${M0(obe)}) = ${M(oats)}`,`NPV = ${M(oi)} + (${M(oocf)}) × PVIFA(${pc(v.r)}, ${n}) + ${M(oats)}/${D(1+r)}^${n} = ${M(NPVo)}`,
'## Incremental view',`ΔNPV = ${M(NPVn)} – (${M(NPVo)}) = ${M(NPVn-NPVo)}`,'Both NPVs are negative because only costs are included; choose the less negative one.'],
answer:`The company should ${NPVn>NPVo?'replace the old machine now':'keep the old machine for '+n+' more years'}: NPV of buying new is ${M(NPVn)} vs. ${M(NPVo)} for keeping the old one (difference ${M(Math.abs(NPVn-NPVo))}).`}}});

/* ---------- CH 7 ---------- */
Cx({ch:'ch7',id:'p7-5',ref:'7-5',title:'Option to wait: when to buy the machine',
inputs:[I('cf','Extra cash flow per year','$',435000),I('L','Obsolete in year','int',10),I('p','Price today','$',2800000),I('d','Price decline per year','$',215000),I('fl','Price floor','$',2155000),I('r','Required return','%',9)],
prompt:v=>`A new machine will increase cash flow by ${M0(v.cf)} per year. The technology will be obsolete ${v.L} years from today regardless of when you buy. The machine costs ${M0(v.p)} today, and its price will decline by ${M0(v.d)} per year until it reaches ${M0(v.fl)}, where it stays. If your required return is ${pc(v.r)}, should you purchase the machine? If so, when?`,
compute:v=>{const r=v.r/100;const rows=[];for(let k=0;k<v.L;k++){const c=Math.max(v.fl,v.p-v.d*k),nv=(-c+v.cf*pvifa(r,v.L-k))*pvif(r,k);rows.push({k,c,nv})}const best=rows.reduce((a,b)=>b.nv>a.nv?b:a);
return{out:[o('Best year to buy',best.k,'n',1,0),o('NPV (today’s $) at best year',best.nv,'$',1),o('NPV if bought today',rows[0].nv,'$')],
steps:['NPV of buying in year k, discounted to today:',`NPV_k = [–Cost_k + ${M0(v.cf)} × PVIFA(${pc(v.r)}, ${v.L} – k)]/(${D(1+r)})^k`,...rows.slice(0,Math.min(rows.length,8)).map(x=>`Year ${x.k}: [–${M0(x.c)} + ${M0(v.cf)} × PVIFA(${pc(v.r)}, ${v.L-x.k})]/${D(1+r)}^${x.k} = ${M(x.nv)}`),'All NPVs must be taken to the same date (today) before comparing.'],
answer:best.nv>0?`Buy the machine in year ${best.k}, when its NPV in today’s dollars is highest (${M(best.nv)}).${rows[0].nv<0?' Buying today has a negative NPV ('+M(rows[0].nv)+').':''}`:'Do not buy the machine: the NPV is negative in every year.'}}});

Cx({ch:'ch7',id:'p7-10',ref:'7-10',title:'Financial break-even point',
inputs:[I('c','Machine cost','$',530000),I('n','Economic life (years)','int',5),I('p','Price per unit','$',75),I('vc','Variable cost per unit','$',27),I('fc','Fixed costs per year','$',235000),I('t','Tax rate','%',21),I('r','Discount rate','%',8)],
prompt:v=>`A machine costs ${M0(v.c)} and has a ${v.n}-year life, depreciated straight-line to zero. Price per unit is ${M(v.p)}, variable cost is ${M(v.vc)}, and fixed costs are ${M0(v.fc)} per year. The tax rate is ${pc(v.t)} and the discount rate is ${pc(v.r)}. What is the financial break-even point?`,
compute:v=>{const r=v.r/100,t=v.t/100,A=pvifa(r,v.n),eac=v.c/A,d=v.c/v.n,q=(eac+v.fc*(1-t)-d*t)/((v.p-v.vc)*(1-t)),qa=(v.fc+d)/(v.p-v.vc),qc=v.fc/(v.p-v.vc);
return{out:[o('Financial break-even (units)',q,'n',1,2),o('EAC of investment',eac,'$'),o('Accounting break-even',qa,'n',0,2),o('Cash break-even',qc,'n',0,2)],
steps:['## Step 1. EAC of the initial investment',`EAC = ${M0(v.c)}/PVIFA(${pc(v.r)}, ${v.n}) = ${M0(v.c)}/${N(A,5)} = ${M(eac)}`,'## Step 2. Depreciation',`D = ${M0(v.c)}/${v.n} = ${M(d)}`,'## Step 3. Financial break-even',`Q_F = [EAC + FC(1 – T) – D(T)]/[(P – v)(1 – T)]`,`Q_F = [${M(eac)} + ${M0(v.fc)}(1 – ${D(t)}) – ${M(d)}(${D(t)})]/[(${M(v.p)} – ${M(v.vc)})(1 – ${D(t)})]`,`Q_F = ${N(q,2)} units`,'## For comparison',`Accounting BE = (FC + D)/(P – v) = ${N(qa,2)};  Cash BE = FC/(P – v) = ${N(qc,2)}`],
answer:`The financial break-even point is about ${Math.round(q).toLocaleString('en-US')} units per year; at this volume the project's NPV is zero.`}}});

Cx({ch:'ch7',id:'p7-23',ref:'7-23',title:'Abandonment decision',
inputs:[I('cf','Annual OCF','$',8700000),I('n','Years','int',10),I('r','Discount rate','%',13),I('i','Initial investment','$',43000000),I('s','Abandonment value after year 1','$',28000000)],
prompt:v=>`A new product is expected to generate annual OCF of ${M0(v.cf)} for ${v.n} years. The discount rate is ${pc(v.r)} and the initial investment is ${M0(v.i)}, with no salvage value. (a) What is the NPV? (b) After the first year, the project can be dismantled and sold for ${M0(v.s)}. If the remaining cash flows are revised after year 1, below what level of expected cash flows should the project be abandoned?`,
compute:v=>{const r=v.r/100,NPV=-v.i+v.cf*pvifa(r,v.n),A=pvifa(r,v.n-1),c2=v.s/A;
return{out:[o('NPV',NPV,'$',1),o('Abandon if annual CF below',c2,'$',1)],
steps:['## (a) NPV',`NPV = –${M0(v.i)} + ${M0(v.cf)} × PVIFA(${pc(v.r)}, ${v.n}) = ${M(NPV)}`,'## (b) Abandonment threshold',`Abandon if PV (at year 1) of the remaining ${v.n-1} cash flows < abandonment value.`,`${M0(v.s)} = C2 × PVIFA(${pc(v.r)}, ${v.n-1}) = C2 × ${N(A,5)}`,`C2 = ${M(c2)}`],
answer:`The NPV is ${M(NPV)}. The firm should abandon the project if the revised annual cash flow falls below ${M(c2)}.`}}});

/* ---------- CH 8 ---------- */
const bondP=(F,cpn,yrs,y,m)=>{const n=Math.round(yrs*m),i=y/m;return F*cpn/m*pvifa(i,n)+F*pvif(i,n)};
const ytm=(P,F,cpn,yrs,m)=>{const r=roots(y=>bondP(F,cpn,yrs,y,m)-P,0.00001,1,0.0005);return r.length?r[0]:NaN};
Cx({ch:'ch8',id:'p8-19',ref:'8-19',title:'Interest rate risk: low vs. high coupon',
inputs:[I('c1','Bond 1 coupon','%',7),I('c2','Bond 2 coupon','%',11),I('n','Years to maturity','int',12),I('m','Payments per year','int',2),I('y','Current YTM','%',9),I('dy','Rate change (±)','%',2)],
prompt:v=>`Bond 1 has a ${pc(v.c1)} coupon and Bond 2 has a ${pc(v.c2)} coupon. Both have ${v.n} years to maturity, make ${v.m===2?'semiannual':v.m===1?'annual':v.m+'-times-a-year'} payments, and have a YTM of ${pc(v.y)}. If interest rates suddenly rise by ${pc(v.dy)}, what is the percentage change in each bond's price? What if rates fall by ${pc(v.dy)}? What does this tell you about the interest rate risk of lower coupon bonds?`,
compute:v=>{const y=v.y/100,d=v.dy/100,F=1000,b=c=>[bondP(F,c/100,v.n,y,v.m),bondP(F,c/100,v.n,y+d,v.m),bondP(F,c/100,v.n,y-d,v.m)];const B1=b(v.c1),B2=b(v.c2);const ch=(a,x)=>(x-a)/a;const n=v.n*v.m;
const line=(c,yy,p)=>`P = ${M(F*c/100/v.m)} × PVIFA(${pc(yy*100/v.m)}, ${n}) + ${M0(F)} × PVIF(${pc(yy*100/v.m)}, ${n}) = ${M(p)}`;
return{out:[o('Bond 1: % change if rates rise',ch(B1[0],B1[1]),'%',1),o('Bond 2: % change if rates rise',ch(B2[0],B2[1]),'%',1),o('Bond 1: % change if rates fall',ch(B1[0],B1[2]),'%',1),o('Bond 2: % change if rates fall',ch(B2[0],B2[2]),'%',1),o('Bond 1 price now',B1[0],'$'),o('Bond 2 price now',B2[0],'$')],
steps:[`## Prices at YTM = ${pc(v.y)}`,line(v.c1,y,B1[0]),line(v.c2,y,B2[0]),`## YTM rises to ${pc(v.y+v.dy)}`,line(v.c1,y+d,B1[1]),line(v.c2,y+d,B2[1]),`%ΔP1 = (${M(B1[1])} – ${M(B1[0])})/${M(B1[0])} = ${P(ch(B1[0],B1[1]))}`,`%ΔP2 = (${M(B2[1])} – ${M(B2[0])})/${M(B2[0])} = ${P(ch(B2[0],B2[1]))}`,`## YTM falls to ${pc(v.y-v.dy)}`,line(v.c1,y-d,B1[2]),line(v.c2,y-d,B2[2]),`%ΔP1 = ${P(ch(B1[0],B1[2]))};  %ΔP2 = ${P(ch(B2[0],B2[2]))}`],
answer:`All else equal, the lower the coupon rate, the greater the bond's price sensitivity to interest rate changes: the ${pc(Math.min(v.c1,v.c2))} coupon bond moves ${P(Math.abs(ch(B1[0],B1[1])))} vs. ${P(Math.abs(ch(B2[0],B2[1])))} when rates rise.`}}});

Cx({ch:'ch8',id:'p8-21',ref:'8-21',title:'Bond yields: setting the coupon to sell at par',
inputs:[I('p','Price of existing bond','$',1048),I('c','Existing coupon rate','%',5.7),I('n','Years to maturity','int',20),I('m','Payments per year','int',2),I('F','Par value','$',1000,{fixed:1})],
prompt:v=>`A company has ${pc(v.c)} coupon bonds on the market that sell for ${M(v.p)}, have a par value of ${M0(v.F)}, make ${v.m===2?'semiannual':'annual'} payments, and mature in ${v.n} years. What coupon rate should it set on new ${v.n}-year bonds if it wants them to sell at par?`,
compute:v=>{const y=ytm(v.p,v.F,v.c/100,v.n,v.m),n=v.n*v.m;
return{out:[o('Required coupon rate (= YTM)',y,'%',1),o('Periodic rate',y/v.m,'%')],
steps:['A bond sells at par when its coupon rate equals the required return (YTM). Find the YTM of the existing bonds.',`${M(v.p)} = ${M(v.F*v.c/100/v.m)} × PVIFA(R, ${n}) + ${M0(v.F)} × PVIF(R, ${n})`,`Trial and error / calculator:  R = ${P(y/v.m,3)} per period`,`YTM = ${v.m} × ${P(y/v.m,3)} = ${P(y)}`],
answer:`The company should set a coupon rate of ${P(y)} on the new bonds.`}}});

Cx({ch:'ch8',id:'p8-29',ref:'8-29',title:'Components of bond returns: current yield vs. capital gains yield',
inputs:[I('cp','Premium bond coupon','%',8),I('cd','Discount bond coupon','%',5),I('y','YTM (both)','%',6.5),I('n','Years to maturity','int',10)],
prompt:v=>`Bond P is a premium bond with a ${pc(v.cp)} coupon. Bond D has a ${pc(v.cd)} coupon and sells at a discount. Both make annual payments, have a YTM of ${pc(v.y)}, and have ${v.n} years to maturity. What is the current yield for each? If interest rates remain unchanged, what is the expected capital gains yield over the next year for each? Explain.`,
compute:v=>{const y=v.y/100,f=c=>{const p0=bondP(1000,c/100,v.n,y,1),p1=bondP(1000,c/100,v.n-1,y,1);return{p0,p1,cy:c*10/p0,cg:(p1-p0)/p0}};const A=f(v.cp),B=f(v.cd);
const bl=(X,c,nm)=>[`## Bond ${nm}`,`P0 = ${M0(c*10)} × PVIFA(${pc(v.y)}, ${v.n}) + $1,000 × PVIF(${pc(v.y)}, ${v.n}) = ${M(X.p0)}`,`P1 = ${M0(c*10)} × PVIFA(${pc(v.y)}, ${v.n-1}) + $1,000 × PVIF(${pc(v.y)}, ${v.n-1}) = ${M(X.p1)}`,`Current yield = ${M0(c*10)}/${M(X.p0)} = ${P(X.cy)}`,`Capital gains yield = (${M(X.p1)} – ${M(X.p0)})/${M(X.p0)} = ${P(X.cg)}`,`Total = ${P(X.cy)} + (${P(X.cg)}) = ${P(X.cy+X.cg)}`];
return{out:[o('Bond P current yield',A.cy,'%',1),o('Bond P capital gains yield',A.cg,'%',1),o('Bond D current yield',B.cy,'%',1),o('Bond D capital gains yield',B.cg,'%',1),o('Bond P price',A.p0,'$'),o('Bond D price',B.p0,'$')],
steps:[...bl(A,v.cp,'P'),...bl(B,v.cd,'D')],
answer:`Premium bonds pay high current income but lose value as maturity nears; discount bonds pay less current income but gain value. For both, current yield + capital gains yield = YTM = ${pc(v.y)}.`}}});

Cx({ch:'ch8',id:'p8-30',ref:'8-30',title:'Holding period yield (HPY)',
inputs:[I('c','Annual coupon rate','%',5.4),I('p','Purchase price','$',940),I('n','Years to maturity','int',10),I('h','Years held','int',2),I('dy','Change in YTM when sold','%',-1)],
prompt:v=>`You buy a bond with an annual coupon of ${pc(v.c)} for ${M(v.p)}. The bond has ${v.n} years to maturity. (a) What rate of return do you expect to earn? (b) ${v.h} years from now, the YTM has ${v.dy<0?'declined':'risen'} by ${pc(Math.abs(v.dy))} and you sell. What price will the bond sell for? What is your HPY? Compare it with the original YTM.`,
compute:v=>{const y=ytm(v.p,1000,v.c/100,v.n,1),y2=y+v.dy/100,p2=bondP(1000,v.c/100,v.n-v.h,y2,1),cp=v.c*10;const cf=[-v.p];for(let t=1;t<=v.h;t++)cf.push(cp+(t===v.h?p2:0));const hpy=irr1(cf);
return{out:[o('Expected return (YTM)',y,'%',1),o('Selling price',p2,'$',1),o('HPY',hpy,'%',1)],
steps:['## (a) Expected return = YTM',`${M(v.p)} = ${M0(cp)} × PVIFA(R, ${v.n}) + $1,000 × PVIF(R, ${v.n})`,`R = YTM = ${P(y)}`,`## (b) Price in ${v.h} years`,`New YTM = ${P(y)} ${v.dy<0?'–':'+'} ${pc(Math.abs(v.dy))} = ${P(y2)}`,`P${v.h} = ${M0(cp)} × PVIFA(${P(y2)}, ${v.n-v.h}) + $1,000 × PVIF(${P(y2)}, ${v.n-v.h}) = ${M(p2)}`,'## HPY',`${M(v.p)} = ${M0(cp)} × PVIFA(R, ${v.h}) + ${M(p2)} × PVIF(R, ${v.h})`,`R = HPY = ${P(hpy)}`],
answer:`The expected return is the YTM of ${P(y)}. The bond sells for ${M(p2)} and the HPY is ${P(hpy)}, ${hpy>y?'higher':'lower'} than the original YTM because interest rates ${v.dy<0?'fell, and bond prices rise when yields fall':'rose, and bond prices fall when yields rise'}.`}}});

Cx({ch:'ch8',id:'p8-31',ref:'8-31',title:'Valuing bonds with irregular payments and a zero',
inputs:[I('F','Face value','$',30000),I('z','Years with no payment','int',6),I('y1','Years of coupon 1','int',8),I('k1','Coupon 1 (per 6 months)','$',800),I('y2','Years of coupon 2','int',6),I('k2','Coupon 2 (per 6 months)','$',1000),I('r','Required return (semiannual comp.)','%',5.6)],
prompt:v=>`Bond M has a face value of ${M0(v.F)} and matures in ${v.z+v.y1+v.y2} years. It makes no payments for the first ${v.z} years, then pays ${M0(v.k1)} every six months for the next ${v.y1} years, and ${M0(v.k2)} every six months for the last ${v.y2} years. Bond N has the same face value and maturity but makes no coupon payments. If the required return is ${pc(v.r)} compounded semiannually, what is the current price of each bond?`,
compute:v=>{const i=v.r/200,T=2*(v.z+v.y1+v.y2),a=v.k1*pvifa(i,2*v.y1)*pvif(i,2*v.z),b=v.k2*pvifa(i,2*v.y2)*pvif(i,2*(v.z+v.y1)),f=v.F*pvif(i,T);
return{out:[o('Price of Bond M',a+b+f,'$',1),o('Price of Bond N',f,'$',1)],
steps:[`Semiannual rate = ${pc(v.r)}/2 = ${pc(v.r/2)}; total periods = ${T}`,'## Bond M',`PV(coupon 1) = ${M0(v.k1)} × PVIFA(${pc(v.r/2)}, ${2*v.y1}) × PVIF(${pc(v.r/2)}, ${2*v.z}) = ${M(a)}`,`PV(coupon 2) = ${M0(v.k2)} × PVIFA(${pc(v.r/2)}, ${2*v.y2}) × PVIF(${pc(v.r/2)}, ${2*(v.z+v.y1)}) = ${M(b)}`,`PV(face) = ${M0(v.F)} × PVIF(${pc(v.r/2)}, ${T}) = ${M(f)}`,`P_M = ${M(a)} + ${M(b)} + ${M(f)} = ${M(a+b+f)}`,'## Bond N (zero coupon)',`P_N = ${M0(v.F)}/(1 + ${D(i)})^${T} = ${M(f)}`],
answer:`Bond M is worth ${M(a+b+f)} and Bond N is worth ${M(f)}. Each annuity is valued first and then discounted back as a lump sum from the period before it starts.`}}});

/* ---------- CH 9 ---------- */
function diffGrowth(v){const R=v.r/100,g=v.g/100,gs=parseList(v.gs).map(x=>x/100);let d=v.d0;const divs=[];gs.forEach(x=>{d*=1+x;divs.push(d)});const n=gs.length,dn1=d*(1+g),Pn=dn1/(R-g);let pv=0;const ls=[];divs.forEach((x,i)=>{pv+=x*pvif(R,i+1);ls.push(`D${i+1} = ${M(i?divs[i-1]:v.d0)} × ${D(1+gs[i])} = ${M(x)}`)});const P0=pv+Pn*pvif(R,n);
return{out:[o('Price today (P0)',P0,'$',1),o(`Price in year ${n} (P${n})`,Pn,'$',1)],
steps:['## Dividends during the high-growth period',...ls,`## Price when constant growth starts (year ${n})`,`P${n} = D${n+1}/(R – g) = ${M(d)} × ${D(1+g)}/(${D(R)} – ${D(g)}) = ${M(Pn)}`,'## Price today',`P0 = `+divs.map((x,i)=>`${M(x)}/${D(1+R)}^${i+1}`).join(' + ')+` + ${M(Pn)}/${D(1+R)}^${n}`,`P0 = ${M(P0)}`],
answer:`The current share price is ${M(P0)}.`}}
Cx({ch:'ch9',id:'p9-15',ref:'9-15',title:'Differential (supernormal) growth',
inputs:[I('d0','Dividend just paid (D0)','$',3.24),I('gs','High-growth rates by year','list','20, 20, 20'),I('g','Constant growth after','%',5),I('r','Required return','%',11)],
prompt:v=>{const g=parseList(v.gs);return `A company's dividends are expected to grow at ${[...new Set(g)].length===1?pc(g[0])+' for the next '+g.length+' years':g.map(pc).join(', ')+' over the next '+g.length+' years'}, with growth falling to a constant ${pc(v.g)} thereafter. If the required return is ${pc(v.r)} and the company just paid a dividend of ${M(v.d0)}, what is the current share price?`},
compute:diffGrowth});
Cx({ch:'ch9',id:'p9-31',ref:'9-31',title:'Nonconstant growth (declining step by step)',
inputs:[I('d0','Dividend just paid (D0)','$',2.95),I('gs','Growth rates by year','list','20, 15, 10'),I('g','Long-run constant growth','%',5),I('r','Required return','%',13)],
prompt:v=>{const g=parseList(v.gs);return `A company just paid a dividend of ${M(v.d0)} per share. Dividend growth will be ${g.map(pc).join(', ')} over the next ${g.length} years, after which it settles at the industry average of ${pc(v.g)} forever. If the required return is ${pc(v.r)}, what will a share sell for today?`},
compute:diffGrowth});

Cx({ch:'ch9',id:'p9-18',ref:'9-18',title:'Finding the dividend (constant growth model)',
inputs:[I('p','Stock price','$',74.32),I('r','Required return','%',10.5),I('g','Dividend growth','%',4)],
prompt:v=>`A stock sells for ${M(v.p)} per share. The market requires a return of ${pc(v.r)}. If the company maintains a constant ${pc(v.g)} growth rate in dividends, what was the most recent dividend per share?`,
compute:v=>{const R=v.r/100,g=v.g/100,d0=v.p*(R-g)/(1+g);
return{out:[o('Most recent dividend (D0)',d0,'$',1),o('Next dividend (D1)',d0*(1+g),'$'),o('Dividend yield',d0*(1+g)/v.p,'%')],
steps:['P0 = D0(1 + g)/(R – g)',`${M(v.p)} = D0(1 + ${D(g)})/(${D(R)} – ${D(g)})`,`D0 = ${M(v.p)} × (${D(R)} – ${D(g)})/${D(1+g)} = ${M(d0)}`,`Check: dividend yield ${P(d0*(1+g)/v.p)} + capital gains yield ${pc(v.g)} = R ${pc(v.r)}`],
answer:`The most recent dividend was ${M(d0)} per share.`}}});

Cx({ch:'ch9',id:'p9-19',ref:'9-19',title:'Valuing preferred stock with delayed dividends',
inputs:[I('d','Annual dividend','$',4),I('s','First dividend in year','int',5),I('r','Required return','%',4.3)],
prompt:v=>`A bank just issued preferred stock that pays an annual dividend of ${M(v.d)} in perpetuity, beginning ${v.s} years from now. If the market requires a return of ${pc(v.r)}, how much does a share cost today?`,
compute:v=>{const R=v.r/100,pk=v.d/R,p0=pk*pvif(R,v.s-1);
return{out:[o('Price today',p0,'$',1),o(`Price in year ${v.s-1}`,pk,'$')],
steps:[`The perpetuity formula gives the value one year before the first dividend, i.e., year ${v.s-1}.`,`P${v.s-1} = D/R = ${M(v.d)}/${D(R)} = ${M(pk)}`,`P0 = ${M(pk)}/(${D(1+R)})^${v.s-1} = ${M(p0)}`],
answer:`A share of preferred stock costs ${M(p0)} today.`}}});

Cx({ch:'ch9',id:'p9-25',ref:'9-25',title:'Price-earnings ratio with new projects',
inputs:[I('e','Earnings (both firms)','$',720000),I('r','Required return','%',11),I('a','Pacific: added earnings','$',150000),I('b','Atlantic: added earnings','$',300000)],
prompt:v=>`Two firms each report earnings of ${M0(v.e)} that will continue in perpetuity without new projects. All earnings are paid as dividends and both require a return of ${pc(v.r)}. (a) What is each firm's current PE ratio? (b) Pacific has a new project that adds ${M0(v.a)} of earnings per year in perpetuity. What is its new PE? (c) Atlantic's new project adds ${M0(v.b)} per year in perpetuity. What is its new PE?`,
compute:v=>{const R=v.r/100,p=v.e/R,pa=(v.e+v.a)/R,pb=(v.e+v.b)/R;
return{out:[o('Current PE',p/v.e,'x',1),o('Pacific new PE',pa/v.e,'x',1),o('Atlantic new PE',pb/v.e,'x',1)],
steps:['## (a) No growth: value = perpetuity',`P = E/R = ${M0(v.e)}/${D(R)} = ${M(p)}`,`PE = ${M(p)}/${M0(v.e)} = ${N(p/v.e,2)} times`,'## (b) Pacific',`P = (${M0(v.e)} + ${M0(v.a)})/${D(R)} = ${M(pa)}`,`PE = ${M(pa)}/${M0(v.e)} = ${N(pa/v.e,2)} times`,'## (c) Atlantic',`P = (${M0(v.e)} + ${M0(v.b)})/${D(R)} = ${M(pb)}`,`PE = ${M(pb)}/${M0(v.e)} = ${N(pb/v.e,2)} times`],
answer:`Current PE = ${N(p/v.e,2)}×. With the new projects, PE rises to ${N(pa/v.e,2)}× (Pacific) and ${N(pb/v.e,2)}× (Atlantic): the PE ratio reflects the value of growth opportunities (NPVGO) relative to current earnings.`}}});

/* ---------- CH 11 ---------- */
Cx({ch:'ch11',id:'p11-18',ref:'11-18',title:'Reward-to-risk ratios: are the stocks correctly priced?',
inputs:[I('by','Stock Y beta','n',1.15),I('ey','Stock Y expected return','%',11.8),I('bz','Stock Z beta','n',0.85),I('ez','Stock Z expected return','%',10.7),I('rf','Risk-free rate','%',4.5),I('mrp','Market risk premium','%',7.1)],
prompt:v=>`Stock Y has a beta of ${v.by} and an expected return of ${pc(v.ey)}. Stock Z has a beta of ${v.bz} and an expected return of ${pc(v.ez)}. If the risk-free rate is ${pc(v.rf)} and the market risk premium is ${pc(v.mrp)}, are these stocks correctly priced?`,
compute:v=>{const rf=v.rf/100,m=v.mrp/100,cy=rf+m*v.by,cz=rf+m*v.bz,ty=(v.ey/100-rf)/v.by,tz=(v.ez/100-rf)/v.bz;const st=(e,c)=>e>c?'above the SML → undervalued':e<c?'below the SML → overvalued':'on the SML → correctly priced';
return{out:[o('CAPM required return, Y',cy,'%',1),o('CAPM required return, Z',cz,'%',1),o('Reward-to-risk, Y',ty,'n',0,4),o('Reward-to-risk, Z',tz,'n',0,4)],
steps:['## Method 1: CAPM',`E(R_Y) = ${D(rf)} + ${D(m)}(${v.by}) = ${P(cy)} vs. given ${pc(v.ey)} → ${st(v.ey/100,cy)}`,`E(R_Z) = ${D(rf)} + ${D(m)}(${v.bz}) = ${P(cz)} vs. given ${pc(v.ez)} → ${st(v.ez/100,cz)}`,'## Method 2: Reward-to-risk (Treynor) ratio',`Market: ${D(m)}/1 = ${N(m,4)}`,`Y: (${D(v.ey/100)} – ${D(rf)})/${v.by} = ${N(ty,4)}`,`Z: (${D(v.ez/100)} – ${D(rf)})/${v.bz} = ${N(tz,4)}`,'A ratio below the market’s means too little return for the risk (overvalued); above means undervalued.'],
answer:`Stock Y plots ${st(v.ey/100,cy)}; its price must ${v.ey/100<cy?'fall':'rise'}. Stock Z plots ${st(v.ez/100,cz)}; its price must ${v.ez/100<cz?'fall':'rise'}.`}}});

Cx({ch:'ch11',id:'p11-24',ref:'11-24',title:'Analyzing a portfolio: hitting a target return',
inputs:[I('w','Amount to invest','$',100000),I('tg','Target return','%',12.7),I('ex','Stock X expected return','%',11.4),I('bx','Stock X beta','n',1.25),I('ey','Stock Y expected return','%',8.68),I('by','Stock Y beta','n',0.85)],
prompt:v=>`You have ${M0(v.w)} to invest in Stocks X and Y. You want a portfolio expected return of ${pc(v.tg)}. Stock X has an expected return of ${pc(v.ex)} and a beta of ${v.bx}; Stock Y has an expected return of ${pc(v.ey)} and a beta of ${v.by}. How much will you invest in Stock Y? How do you interpret your answer? What is the beta of your portfolio?`,
compute:v=>{const t=v.tg/100,x=v.ex/100,y=v.ey/100,wx=(t-y)/(x-y),wy=1-wx,bp=wx*v.bx+wy*v.by;
return{out:[o('Investment in Y',wy*v.w,'$',1),o('Weight in X',wx,'n',0,5),o('Weight in Y',wy,'n',0,5),o('Portfolio beta',bp,'n',1,4)],
steps:['E(R_p) = w_X·E(R_X) + (1 – w_X)·E(R_Y)',`${D(t)} = w_X(${D(x)}) + (1 – w_X)(${D(y)})`,`w_X = (${D(t)} – ${D(y)})/(${D(x)} – ${D(y)}) = ${N(wx,5)}`,`w_Y = 1 – ${N(wx,5)} = ${N(wy,5)}`,`Investment in Y = ${N(wy,5)} × ${M0(v.w)} = ${M(wy*v.w)}`,`β_p = ${N(wx,5)}(${v.bx}) + (${N(wy,5)})(${v.by}) = ${N(bp,4)}`],
answer:wy<0?`You invest ${M(wy*v.w)} in Stock Y: a negative weight means you short sell ${M(-wy*v.w)} of Stock Y and invest ${M(wx*v.w)} in Stock X. The portfolio beta is ${N(bp,2)}.`:`You invest ${M(wy*v.w)} in Stock Y and ${M(wx*v.w)} in Stock X. The portfolio beta is ${N(bp,2)}.`}}});

function statsCalc(pr,a,b){const p=parseList(pr),A=parseList(a).map(Number),B=parseList(b).map(Number);const E=x=>x.reduce((s,r,i)=>s+p[i]*r,0);const ea=E(A),eb=E(B);const va=A.reduce((s,r,i)=>s+p[i]*(r-ea)**2,0),vb=B.reduce((s,r,i)=>s+p[i]*(r-eb)**2,0);const cov=A.reduce((s,r,i)=>s+p[i]*(r-ea)*(B[i]-eb),0);return{p,A,B,ea,eb,va,vb,sa:Math.sqrt(va),sb:Math.sqrt(vb),cov,rho:cov/Math.sqrt(va*vb)}}
const pf=x=>x.toFixed(4).replace(/0+$/,'').replace(/\.$/,'');
Cx({ch:'ch11',id:'p11-25',ref:'11-25',title:'Expected return, SD, covariance and correlation',
inputs:[I('p','Probabilities by state','list','1/3, 1/3, 1/3',{fixed:1}),I('a','Stock A returns','list','.099, .113, .059'),I('b','Stock B returns','list','-.073, .128, .293')],
prompt:v=>`States of the economy (bear, normal, bull) occur with probabilities ${v.p}. Returns on Stock A are ${v.a}; returns on Stock B are ${v.b}. Calculate the expected return and standard deviation of each stock, and the covariance and correlation between them.`,
compute:v=>{const s=statsCalc(v.p,v.a,v.b),pp=s.p.map(pf);
return{out:[o('E(R_A)',s.ea,'%',1),o('E(R_B)',s.eb,'%',1),o('σ_A',s.sa,'%',1),o('σ_B',s.sb,'%',1),o('Cov(A,B)',s.cov,'n',1,6),o('Correlation',s.rho,'n',1,4)],
steps:['## Expected returns',`E(R_A) = `+s.A.map((r,i)=>`${pp[i]}(${r})`).join(' + ')+` = ${P(s.ea)}`,`E(R_B) = `+s.B.map((r,i)=>`${pp[i]}(${r})`).join(' + ')+` = ${P(s.eb)}`,'## Variances and standard deviations',`σ²_A = `+s.A.map((r,i)=>`${pp[i]}(${r} – ${N(s.ea,4)})²`).join(' + ')+` = ${N(s.va,5)};  σ_A = ${P(s.sa)}`,`σ²_B = `+s.B.map((r,i)=>`${pp[i]}(${r} – ${N(s.eb,4)})²`).join(' + ')+` = ${N(s.vb,5)};  σ_B = ${P(s.sb)}`,'## Covariance and correlation',`Cov(A,B) = Σ p_s (R_A – E[R_A])(R_B – E[R_B]) = ${N(s.cov,6)}`,`ρ = Cov/(σ_A σ_B) = ${N(s.cov,6)}/(${N(s.sa,4)} × ${N(s.sb,4)}) = ${N(s.rho,4)}`],
answer:`E(R_A) = ${P(s.ea)}, σ_A = ${P(s.sa)}; E(R_B) = ${P(s.eb)}, σ_B = ${P(s.sb)}. Cov(A,B) = ${N(s.cov,6)} and the correlation is ${N(s.rho,4)}, so the stocks tend to move in ${s.rho<0?'opposite directions':'the same direction'}.`}}});

Cx({ch:'ch11',id:'p11-33',ref:'11-33',title:'Systematic vs. unsystematic risk',
inputs:[I('p','Probabilities by state','list','.15, .55, .30',{fixed:1}),I('a','Stock I returns','list','.12, .17, .06'),I('b','Stock II returns','list','-.35, .12, .33'),I('m','Market risk premium','%',7.5),I('rf','Risk-free rate','%',4)],
prompt:v=>`States of the economy (recession, normal, irrational exuberance) have probabilities ${v.p}. Stock I returns: ${v.a}. Stock II returns: ${v.b}. The market risk premium is ${pc(v.m)} and the risk-free rate is ${pc(v.rf)}. Which stock has more systematic risk? Which has more unsystematic risk? Which is “riskier”?`,
compute:v=>{const s=statsCalc(v.p,v.a,v.b),rf=v.rf/100,m=v.m/100,bi=(s.ea-rf)/m,bii=(s.eb-rf)/m,pp=s.p.map(pf);
return{out:[o('β_I',bi,'n',1,2),o('β_II',bii,'n',1,2),o('σ_I',s.sa,'%',1),o('σ_II',s.sb,'%',1),o('E(R_I)',s.ea,'%'),o('E(R_II)',s.eb,'%')],
steps:['## Stock I',`E(R_I) = `+s.A.map((r,i)=>`${pp[i]}(${r})`).join(' + ')+` = ${P(s.ea)}`,`CAPM: ${P(s.ea)} = ${pc(v.rf)} + ${pc(v.m)} × β_I  →  β_I = ${N(bi,2)}`,`σ²_I = ${N(s.va,5)};  σ_I = ${P(s.sa)}`,'## Stock II',`E(R_II) = `+s.B.map((r,i)=>`${pp[i]}(${r})`).join(' + ')+` = ${P(s.eb)}`,`CAPM: β_II = (${P(s.eb)} – ${pc(v.rf)})/${pc(v.m)} = ${N(bii,2)}`,`σ²_II = ${N(s.vb,5)};  σ_II = ${P(s.sb)}`,'## Interpretation','Beta measures systematic risk; standard deviation measures total risk. Unsystematic risk can be diversified away, so only systematic risk is rewarded.'],
answer:`Stock ${bi>bii?'I':'II'} has more systematic risk (β = ${N(Math.max(bi,bii),2)}), while Stock ${s.sb>s.sa?'II':'I'} has more total and unsystematic risk (σ = ${P(Math.max(s.sa,s.sb))}). Since unsystematic risk can be diversified away, Stock ${bi>bii?'I':'II'} is actually the “riskier” stock and has the higher risk premium.`}}});

Cx({ch:'ch11',id:'p11-30',ref:'11-30',title:'Capital Market Line (CML)',
inputs:[I('em','Market expected return','%',11.5),I('sm','Market SD','%',19),I('rf','Risk-free rate','%',4.1),I('sp','(a) Portfolio SD','%',9),I('ep','(b) Target expected return','%',20)],
prompt:v=>`The market portfolio has an expected return of ${pc(v.em)} and a standard deviation of ${pc(v.sm)}. The risk-free rate is ${pc(v.rf)}. (a) What is the expected return on a well-diversified portfolio with a standard deviation of ${pc(v.sp)}? (b) What is the standard deviation of a well-diversified portfolio with an expected return of ${pc(v.ep)}?`,
compute:v=>{const s=(v.em-v.rf)/v.sm,ea=v.rf/100+s*v.sp/100,sb=(v.ep-v.rf)/100/s;
return{out:[o('(a) Expected return',ea,'%',1),o('(b) Standard deviation',sb,'%',1),o('CML slope',s,'n',0,5)],
steps:['A well-diversified portfolio has no unsystematic risk, so it lies on the CML.',`Slope = [E(R_M) – R_f]/σ_M = (${D(v.em/100)} – ${D(v.rf/100)})/${D(v.sm/100)} = ${N(s,5)}`,`(a) E(R_P) = R_f + slope × σ_P = ${D(v.rf/100)} + ${N(s,5)}(${D(v.sp/100)}) = ${P(ea)}`,`(b) ${D(v.ep/100)} = ${D(v.rf/100)} + ${N(s,5)} × σ_P  →  σ_P = ${P(sb)}`],
answer:`(a) The expected return is ${P(ea)}. (b) The standard deviation is ${P(sb)}.`}}});

Cx({ch:'ch11',id:'p11-31',ref:'11-31',title:'Beta from correlation, then CAPM',
inputs:[I('ep','Portfolio (Rf + market) return','%',9),I('sp','Portfolio SD','%',16),I('rf','Risk-free rate','%',4.1),I('em','Market expected return','%',11),I('rho','Correlation with market','n',0.38),I('si','Security SD','%',60)],
prompt:v=>`A portfolio combining the risk-free asset and the market portfolio has an expected return of ${pc(v.ep)} and a standard deviation of ${pc(v.sp)}. The risk-free rate is ${pc(v.rf)} and the market's expected return is ${pc(v.em)}. Assuming CAPM holds, what expected return would a security earn if it had a ${v.rho} correlation with the market and a standard deviation of ${pc(v.si)}?`,
compute:v=>{const s=(v.ep-v.rf)/v.sp,sm=(v.em-v.rf)/s/100,b=v.rho*v.si/100/sm,e=v.rf/100+b*(v.em-v.rf)/100;
return{out:[o('Expected return',e,'%',1),o('Beta',b,'n',1,4),o('Market SD',sm,'%',1),o('CML slope',s,'n',0,4)],
steps:['## Step 1. CML slope from the two points (R_f, 0) and the portfolio',`Slope = (${D(v.ep/100)} – ${D(v.rf/100)})/(${D(v.sp/100)} – 0) = ${N(s,4)}`,'## Step 2. Market SD',`${D(v.em/100)} = ${D(v.rf/100)} + ${N(s,4)} × σ_M  →  σ_M = ${P(sm)}`,'## Step 3. Beta',`β = ρ × σ_i/σ_M = ${v.rho} × ${D(v.si/100)}/${N(sm,4)} = ${N(b,4)}`,'## Step 4. CAPM',`E(R_i) = ${D(v.rf/100)} + ${N(b,4)}(${D(v.em/100)} – ${D(v.rf/100)}) = ${P(e)}`],
answer:`The security's beta is ${N(b,2)}, so its expected return is ${P(e)}.`}}});

Cx({ch:'ch11',id:'p11-34',ref:'11-34',title:'SML: backing out Rf and the market return',
inputs:[I('b1','Security 1 beta','n',1.25),I('e1','Security 1 expected return','%',13.28),I('b2','Security 2 beta','n',0.85),I('e2','Security 2 expected return','%',10.12)],
prompt:v=>`Pete Corp. has a beta of ${v.b1} and an expected return of ${pc(v.e1)}. Repete Co. has a beta of ${v.b2} and an expected return of ${pc(v.e2)}. Assume both are correctly priced. Based on the CAPM, what is the expected return on the market? What is the risk-free rate?`,
compute:v=>{const e1=v.e1/100,e2=v.e2/100,rf=(v.b1*e2-v.b2*e1)/(v.b1-v.b2),rm=rf+(e1-rf)/v.b1;
return{out:[o('Risk-free rate',rf,'%',1),o('Market expected return',rm,'%',1)],
steps:['Correctly priced securities have equal reward-to-risk ratios:',`(${D(e1)} – R_f)/${v.b1} = (${D(e2)} – R_f)/${v.b2}`,`${v.b2}(${D(e1)} – R_f) = ${v.b1}(${D(e2)} – R_f)`,`R_f = (${v.b1} × ${D(e2)} – ${v.b2} × ${D(e1)})/(${v.b1} – ${v.b2}) = ${P(rf)}`,`CAPM: ${D(e1)} = ${N(rf,4)} + ${v.b1}(R_M – ${N(rf,4)})  →  R_M = ${P(rm)}`,`Check with security 2: ${N(rf,4)} + ${v.b2}(${N(rm,4)} – ${N(rf,4)}) = ${P(rf+v.b2*(rm-rf))}`],
answer:`The risk-free rate is ${P(rf)} and the expected market return is ${P(rm)}.`}}});

/* ===== CALCULATOR SHORTCUTS: step-by-step keystrokes for every problem =====
   step = {t:title, ba:'BA II Plus keys', sci:'scientific keys', out:'display', why:'Korean note'}
   [X] = a key; plain text = number you type */
const rd=x=>Math.abs(x)>=100?+(+x).toFixed(2):+(+x).toFixed(6);
const kn=x=>{x=rd(x);return x<0?`${-x} [+/-]`:`${x}`};
const kp=x=>String(rd(x));               /* plain number for scientific entry */
const dv=(x,d=2)=>!isFinite(x)?'Error':(x<0?'-':'')+Math.abs(x).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const TVM=(o,c)=>'[2ND] [CLR TVM]  '+['N','I/Y','PV','PMT','FV'].filter(k=>o[k]!==undefined).map(k=>`${kn(o[k])} [${k}]`).join('  ')+`  [CPT] [${c}]`;
const TVMc=(o,c)=>['N','I/Y','PV','PMT','FV'].filter(k=>o[k]!==undefined).map(k=>`${kn(o[k])} [${k}]`).join('  ')+`  [CPT] [${c}]`;   /* keep other registers */
function runs(cf){const r=[];for(let i=1;i<cf.length;i++){const v=+cf[i].toFixed(6);if(r.length&&r[r.length-1].v===v)r[r.length-1].f++;else r.push({v,f:1})}return r}
const CFK=(cf,I)=>'[CF] [2ND] [CLR WORK]  '+kn(cf[0])+' [ENTER]  '+runs(cf).map(x=>`[↓] ${kn(x.v)} [ENTER] [↓]${x.f>1?' '+x.f+' [ENTER]':''}`).join('  ')+(I!==undefined?`  [NPV] ${kp(I)} [ENTER] [↓] [CPT]`:'');
const cfSum=cf=>'CF0 = '+dv(cf[0],0)+'  ·  '+runs(cf).map((x,i)=>`C${String(i+1).padStart(2,'0')} = ${dv(x.v,x.v%1?4:0)}${x.f>1?` (F${String(i+1).padStart(2,'0')} = ${x.f})`:''}`).join('  ·  ');
const pc2=x=>kp(x/100);
const KEYS={};

/* CH2 */
KEYS['p2-17']=v=>{const t=v.t/100,ebit=v.s-v.cogs-v.sga-v.dep,ti=ebit-v.int,tax=Math.max(0,ti*t),ni=ti-tax,ocf=ebit+v.dep-tax,nld=v.int-(ocf-v.dnwc-v.ncs-(v.div-v.neq));
return[{t:'EBIT',sci:`${kp(v.s)} [−] ${kp(v.cogs)} [−] ${kp(v.sga)} [−] ${kp(v.dep)} [=]`,out:dv(ebit)},
{t:'과세표준 → 세금 → 순이익',sci:`[Ans] [−] ${kp(v.int)} [=]  →  ${ti>0?`[Ans] [×] ${kp(1-t)} [=]`:'음수이므로 세금 0, 순이익 = 과세표준'}`,out:dv(ni),why:'TI × (1 – T)로 세금과 순이익을 한 번에.'},
{t:'OCF',sci:`${kp(ebit)} [+] ${kp(v.dep)} [−] ${kp(tax)} [=]`,out:dv(ocf)},
{t:'지름길: 장기부채 변화 한 줄',sci:`${kp(v.int)} [−] [(] ${kp(ocf)} [−] ${kp(v.dnwc)} [−] ${kp(v.ncs)} [−] ${kp(v.div)} [+] ${kp(v.neq)} [)] [=]`,out:dv(nld),why:'Net new LTD = Interest – (CFA – CF to stockholders).'}]};
KEYS['p2-19']=v=>{const t=v.t/100,ebit=v.s-v.cogs-v.dep,ti=ebit-v.int,tax=Math.max(0,ti*t),ni=ti-tax,ocf=ebit+v.dep-tax,dn=(v.ca1-v.cl1)-(v.ca0-v.cl0),ncs=v.nfa1-v.nfa0+v.dep,cfa=ocf-dn-ncs,cfc=v.int-v.nd,cfs=cfa-cfc;
return[{t:'EBIT → 순이익',sci:`${kp(v.s)} [−] ${kp(v.cogs)} [−] ${kp(v.dep)} [=]  [Ans] [−] ${kp(v.int)} [=]  [Ans] [×] ${kp(1-t)} [=]`,out:dv(ni),why:'EBIT = '+dv(ebit)+', 과세표준 = '+dv(ti)},
{t:'OCF',sci:`${kp(ebit)} [+] ${kp(v.dep)} [−] ${kp(tax)} [=]`,out:dv(ocf)},
{t:'ΔNWC 한 줄',sci:`[(] ${kp(v.ca1)} [−] ${kp(v.cl1)} [)] [−] [(] ${kp(v.ca0)} [−] ${kp(v.cl0)} [)] [=]`,out:dv(dn)},
{t:'순자본지출(NCS)',sci:`${kp(v.nfa1)} [−] ${kp(v.nfa0)} [+] ${kp(v.dep)} [=]`,out:dv(ncs)},
{t:'CFA',sci:`${kp(ocf)} [−] ${kp(dn)} [−] ${kp(ncs)} [=]`,out:dv(cfa)},
{t:'채권자 → 주주 → 신규 주식',sci:`${kp(v.int)} [−] ${kp(v.nd)} [=]   ${kp(cfa)} [−] ${kp(cfc)} [=]   ${kp(v.div)} [−] ${kp(cfs)} [=]`,out:`${dv(cfc)} / ${dv(cfs)} / ${dv(v.div-cfs)}`}]};

/* CH4 */
KEYS['p4-52']=v=>{const r=v.r/100,pva=v.c*pvifa(r,v.n),cf=Array(v.b+v.n).fill(0);for(let t=v.a;t<v.a+v.n;t++)cf[t]+=v.c;for(let t=v.b;t<v.b+v.n;t++)cf[t]+=v.c;const tot=npv(r,cf),pmt=tot/pvifa(r,v.a);
return[{t:'지름길: 학비 전체를 CF 워크시트에 한 번에',ba:CFK(cf,v.r),out:dv(tot),why:'두 아이 학비가 겹치는 해는 더해서 입력하고, 같은 금액이 이어지면 F(빈도)로 묶습니다. '+cfSum(cf)},
{t:'(대안) 한 아이 학비 PV → 각각 할인',ba:TVM({N:v.n,'I/Y':v.r,PMT:v.c,FV:0},'PV')+`   →   ${kn(pva)} [FV]  ${v.a-1} [N]  0 [PMT]  [CPT] [PV]`,sci:`[(] 1 [−] 1 [÷] ${kp(1+r)} [^] ${v.n} [)] [÷] ${kp(r)} [×] ${kp(v.c)} [=]   [Ans] [÷] ${kp(1+r)} [^] ${v.a-1} [=]`,out:dv(pva)+' → '+dv(pva*pvif(r,v.a-1))},
{t:'매년 저축액 PMT',ba:TVM({N:v.a,'I/Y':v.r,PV:-tot,FV:0},'PMT'),sci:`${kp(tot)} [×] ${kp(r)} [÷] [(] 1 [−] 1 [÷] ${kp(1+r)} [^] ${v.a} [)] [=]`,out:dv(pmt)}]};
KEYS['p4-55']=v=>{const r=v.r/100,g=v.g/100,pv=v.fv*pvif(r,v.T),ra=(1+r)/(1+g)-1,c1=pv/pvifa(ra,v.T),c=c1*(1+g);
return[{t:'목표액의 PV',ba:TVM({N:v.T,'I/Y':v.r,PMT:0,FV:v.fv},'PV'),sci:`${kp(v.fv)} [÷] ${kp(1+r)} [^] ${v.T} [=]`,out:dv(-pv)},
{t:'지름길: 성장 연금용 조정 이자율',sci:`${kp(1+r)} [÷] ${kp(1+g)} [−] 1 [=] [×] 100 [=]`,out:N(ra*100,4)+'%',why:'성장 연금 PV = C₁/(1+g) × PVIFA(r*, T), r* = (1+r)/(1+g) – 1. 일반 TVM으로 풀 수 있게 바꾸는 요령.'},
{t:'TVM으로 C₁/(1+g) → × (1+g)',ba:TVMc({N:v.T,'I/Y':+(ra*100).toFixed(6),PV:-pv,FV:0},'PMT')+`   [×] ${kp(1+g)} [=]`,out:dv(c1)+' → '+dv(c)},
{t:'월급 대비 저축률',sci:`${kp(c)} [÷] ${kp(v.s)} [=]`,out:N(c/v.s*100,2)+'%'}]};
KEYS['p4-56']=v=>{const i=v.apr/12,n=v.y*12,L=v.p-v.dn,pmt=L/pvifa(i/100,n),rem=n-v.m-1,bal=pmt*pvifa(i/100,rem);
return[{t:'월 상환액',ba:TVM({N:n,'I/Y':+i.toFixed(6),PV:L,FV:0},'PMT'),sci:`${kp(L)} [×] ${kp(i/100)} [÷] [(] 1 [−] 1 [÷] ${kp(1+i/100)} [^] ${n} [)] [=]`,out:dv(-pmt),why:'월복리: I/Y = APR ÷ 12 = '+N(i,4)+', N = 개월 수.'},
{t:'지름길: 남은 잔액 (PMT 그대로 두고 N만 변경)',ba:`${rem} [N]  0 [FV]  [CPT] [PV]`,out:dv(bal),why:`이미 ${v.m}회 냈고 상환일에 1회 더 → 그 뒤 남은 ${rem}회의 PV. (BA: [2ND] [AMORT] P1=1, P2=${v.m+1} → BAL도 같은 값)`},
{t:'총 상환액',sci:`${kp(bal)} [×] ${kp(1+v.pen/100)} [+] ${kp(pmt)} [=]`,out:dv(bal*(1+v.pen/100)+pmt)}]};
KEYS['p4-65']=v=>{const t=(pv,a)=>{const i=a/1200,x=1-pv*i/v.c;return x<=0?Infinity:-Math.log(x)/Math.log(1+i)};const pf=v.pv*(1+v.fee/100);
return[{t:'현재 카드: 개월 수',ba:TVM({'I/Y':+(v.a1/12).toFixed(6),PV:v.pv,PMT:-v.c,FV:0},'N'),sci:`[ln] [(] 1 [÷] [(] 1 [−] ${kp(v.pv)} [×] ${kp(v.a1/1200)} [÷] ${kp(v.c)} [)] [)] [÷] [ln] ${kp(1+v.a1/1200)} [=]`,out:dv(t(v.pv,v.a1))},
{t:'새 카드 (수수료 없음)',ba:TVMc({'I/Y':+(v.a2/12).toFixed(6)},'N'),out:dv(t(v.pv,v.a2)),why:'다른 값은 그대로 두고 I/Y만 바꿔 CPT N.'},
{t:'새 카드 + 수수료',ba:TVMc({PV:+pf.toFixed(2)},'N'),out:dv(t(pf,v.a2)),why:`잔액 × (1 + ${pc(v.fee)}) = ${dv(pf)}`},

{t:`P${n} = D${n+1}/(R – g)`,sci:`[Ans] [÷] ${kp(R-g)} [=]`,out:N(pn,4)},
{t:`지름길: CF 워크시트 (C0${n} = D${n} + P${n})`,ba:CFK(cf,v.r),out:dv(npv(R,cf)),why:'같은 시점의 배당과 주가를 더해서 한 칸에 입력. '+cfSum(cf)}]}

function statKeys(v,beta){const s=statsCalc(v.p,v.a,v.b),eq=s.p.every(x=>Math.abs(x-s.p[0])<1e-9),fr=s.p.map(x=>Math.round(x*100));
const one=(R,nm,E,S)=>({t:`${nm}: STAT으로 E(R)과 σ`,ba:eq?`[2ND] [DATA] [2ND] [CLR WORK]  `+R.map((r,i)=>`${kn(r)} [ENTER] [↓] [↓]`).join(' ')+`  [2ND] [STAT] (1-V) [↓] [↓] x̄  [↓] [↓] σx`:`[2ND] [DATA] [2ND] [CLR WORK]  `+R.map((r,i)=>`${kn(r)} [ENTER] [↓] ${fr[i]} [ENTER] [↓]`).join(' ')+`  [2ND] [STAT] (1-V) [↓] [↓] x̄  [↓] [↓] σx`,out:N(E*100,2)+'% / '+N(S*100,2)+'%',why:eq?'확률이 같으면 수익률만 입력 → x̄ = E(R), σx(모표준편차) = σ.':'확률 × 100을 빈도(Y01…)로 입력 → x̄ = E(R), σx = σ. (공학용: STAT 모드 Frequency ON)'});
const st=[one(s.A,beta?'Stock I':'Stock A',s.ea,s.sa),one(s.B,beta?'Stock II':'Stock B',s.eb,s.sb)];
if(!beta){st.push({t:'지름길: 상관계수는 2-변수 STAT의 r',ba:`[2ND] [DATA] [2ND] [CLR WORK]  `+s.A.map((a,i)=>`${kn(a)} [ENTER] [↓] ${kn(s.B[i])} [ENTER] [↓]`).join(' ')+`  [2ND] [STAT] (LIN) … r`,out:N(s.rho,4),why:'확률이 같을 때만 그대로 사용 가능.'},{t:'공분산 = r × σA × σB',sci:`${kp(+s.rho.toFixed(6))} [×] ${kp(+s.sa.toFixed(6))} [×] ${kp(+s.sb.toFixed(6))} [=]`,out:N(s.cov,6)})}
else{const rf=v.rf/100,m=v.m/100;st.push({t:'베타 = (E(R) – Rf)/MRP',sci:`[(] ${kp(+s.ea.toFixed(6))} [−] ${kp(rf)} [)] [÷] ${kp(m)} [=]    [(] ${kp(+s.eb.toFixed(6))} [−] ${kp(rf)} [)] [÷] ${kp(m)} [=]`,out:N((s.ea-rf)/m,2)+' / '+N((s.eb-rf)/m,2)})}
return st}
